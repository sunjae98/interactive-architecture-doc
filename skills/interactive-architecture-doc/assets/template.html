<script>
// Theme before first paint (no flash): the saved choice, else the OS preference. localStorage can
// throw on file:// (blocked storage), so every access is guarded.
(function () {
  var theme = null;
  try { theme = localStorage.getItem("iad-theme"); } catch (e) { /* storage unavailable */ }
  if (theme !== "light" && theme !== "dark") {
    theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  document.documentElement.setAttribute("data-theme", theme);
})();
</script>
<script>
// Page errors from load onward, read by the self-check (#iad-selfcheck). Capped so a noisy page stays small.
(function () {
  var errors = window.__iadErrors = [];
  function add(type, message) { if (errors.length < 50) errors.push({ type: type, message: String(message) }); }
  window.addEventListener("error", function (e) {
    add("error", (e.message || "error") + (e.filename ? " @ " + e.filename + ":" + e.lineno : ""));
  });
  window.addEventListener("unhandledrejection", function (e) {
    var r = e.reason;
    add("unhandledrejection", r && r.message ? r.message : r);
  });
  document.addEventListener("securitypolicyviolation", function (e) {
    add("csp", e.violatedDirective + " blocked " + (e.blockedURI || "inline"));
  });
})();
</script>

<style>
  /* ==== Design tokens ======================================================
     Walkthrough style. The ONLY place colors may appear; component CSS and JS reference tokens.
     Radix Colors 3.0.0 (MIT): slate neutrals; node kinds crimson / violet / amber / green / slate /
     blue; scenario slots blue / purple / teal / orange / red / pink. Light-theme text steps for app,
     store, dep, s1 and s4 are a few percent darker than Radix 11 so they reach 4.5:1 on their bg. */
  :root{
    color-scheme:light;
    --bg:#f9f9fb; --surface:#fcfcfd; --surface-2:#f0f0f3; --border:#d9d9e0; --border-soft:#e8e8ec;
    --text:#1c2024; --muted:#60646c; --primary:#0090ff; --primary-bg:#e6f4fe;
    --client-bg:#ffe9f0; --client-bd:#efacc5; --client-tx:#c41e5c;
    --app-bg:#fff7c2; --app-bd:#e9c162; --app-tx:#a25f00;
    --store-bg:#e6f6eb; --store-bd:#8eceaa; --store-tx:#1f7c54;
    --infra-bg:#f4f0fe; --infra-bd:#c2b5f5; --infra-tx:#6550b9;
    --dep-bg:#e6f4fe; --dep-bd:#8ec8f6; --dep-tx:#0c6ec4;
    --tool-bg:#f0f0f3; --tool-bd:#cdced6; --tool-tx:#60646c;
    --err:#e5484d; --err-bg:#ffefef; --err-tx:#ce2c31;
    --s1:#0090ff; --s1-bg:#e6f4fe; --s1-tx:#0c6ec4;
    --s2:#8e4ec6; --s2-bg:#f7edfe; --s2-tx:#8145b5;
    --s3:#12a594; --s3-bg:#e0f8f3; --s3-tx:#067a6f;
    --s4:#ef5f00; --s4-bg:#ffefd6; --s4-tx:#ba4700;
    --s5:#e5484d; --s5-bg:#ffefef; --s5-tx:#ce2c31;
    --s6:#d6409f; --s6-bg:#fee9f5; --s6-tx:#c2298a;
    --dim:.15;
    --font-sans:"IAD Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji";
    --font-mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji";
  }
  [data-theme="dark"]{
    color-scheme:dark;
    --bg:#111113; --surface:#18191b; --surface-2:#212225; --border:#363a3f; --border-soft:#2b2d31;
    --text:#edeef0; --muted:#b0b4ba; --primary:#3b9eff; --primary-bg:#0d2847;
    --client-bg:#2f1520; --client-bd:#8c2f52; --client-tx:#ff92ad;
    --app-bg:#302008; --app-bd:#8f6424; --app-tx:#ffca16;
    --store-bg:#132d21; --store-bd:#2f7c57; --store-tx:#3dd68c;
    --infra-bg:#221c3d; --infra-bd:#5842c3; --infra-tx:#baa7ff;
    --dep-bg:#0d2847; --dep-bd:#205d9e; --dep-tx:#70b8ff;
    --tool-bg:#212225; --tool-bd:#4a4f55; --tool-tx:#b0b4ba;
    --err:#ff9592; --err-bg:#3b1219; --err-tx:#ffd1d9;
    --s1:#3b9eff; --s1-bg:#0d2847; --s1-tx:#70b8ff;
    --s2:#bf7af0; --s2-bg:#301c3b; --s2-tx:#d19dff;
    --s3:#0bd8b6; --s3-bg:#0d2d2a; --s3-tx:#0bd8b6;
    --s4:#ff801f; --s4-bg:#331e0b; --s4-tx:#ffa057;
    --s5:#ff9592; --s5-bg:#3b1219; --s5-tx:#ffd1d9;
    --s6:#e66cbc; --s6-bg:#37172f; --s6-tx:#ff8dcc;
    --dim:.14;
  }
  [data-s="s1"]{--cc:var(--s1);--cc-bg:var(--s1-bg);--cc-tx:var(--s1-tx);}
  [data-s="s2"]{--cc:var(--s2);--cc-bg:var(--s2-bg);--cc-tx:var(--s2-tx);}
  [data-s="s3"]{--cc:var(--s3);--cc-bg:var(--s3-bg);--cc-tx:var(--s3-tx);}
  [data-s="s4"]{--cc:var(--s4);--cc-bg:var(--s4-bg);--cc-tx:var(--s4-tx);}
  [data-s="s5"]{--cc:var(--s5);--cc-bg:var(--s5-bg);--cc-tx:var(--s5-tx);}
  [data-s="s6"]{--cc:var(--s6);--cc-bg:var(--s6-bg);--cc-tx:var(--s6-tx);}

  /* ==== Page ============================================================== */
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 var(--font-sans);word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;}
  code.ic,.mono{font-family:var(--font-mono);font-size:.86em;letter-spacing:-.01em;}
  code.ic{background:var(--surface-2);border-radius:4px;padding:0 4px;}
  .wrap{max-width:1360px;margin:0 auto;padding-block:20px 32px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:14px;}
  :focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px;}
  button{font:inherit;color:inherit;}

  header.top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;}
  h1{font-size:20px;margin:0 0 2px;letter-spacing:-.01em;}
  .sub{margin:0;color:var(--muted);font-size:13.5px;max-width:860px;}
  .facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .fact{display:inline-flex;gap:6px;align-items:baseline;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:1px 10px;font-size:12px;}
  .fact b{font-weight:600;}
  .fact span{color:var(--muted);}

  /* Theme toggle: same icon button as the overview template. Shows the theme you switch to. */
  .theme-toggle{
    flex:none;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;padding:0;
    border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);cursor:pointer;
  }
  .theme-toggle:hover{border-color:var(--primary);}
  .theme-toggle svg{width:18px;height:18px;display:block;}
  .theme-toggle .icon-sun{display:none;}
  [data-theme="dark"] .theme-toggle .icon-sun{display:block;}
  [data-theme="dark"] .theme-toggle .icon-moon{display:none;}

  .lbl{font-size:12px;color:var(--muted);margin:0 0 6px;font-weight:500;}
  .cases{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;}
  .case{text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 10px 8px 14px;position:relative;display:flex;flex-direction:column;gap:1px;}
  .case::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--cc);opacity:.45;}
  .case .t{font-weight:600;font-size:13.5px;}
  .case .s{font-size:12px;color:var(--muted);}
  .case .case-tag{display:inline-block;font:600 10.5px var(--font-sans);color:var(--cc-tx);border:1px solid var(--cc);border-radius:5px;padding:0 5px;margin-left:2px;vertical-align:1px;}
  .case:hover{border-color:var(--cc);}
  .case[aria-pressed="true"]{border-color:var(--cc);box-shadow:0 0 0 1px var(--cc) inset;background:var(--cc-bg);}
  .case[aria-pressed="true"]::before{opacity:1;}

  /* Stage: the map and the controls are two joined panels so the narration can sit beside both
     ("side") or, for a map too wide to fit beside it, between them ("stacked", set by the runtime on
     #stage[data-fit]). Narrow screens (<= 1180px, data-fit "narrow") keep the narration under everything. */
  .stage{display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-areas:"map aside" "ctrl aside";column-gap:12px;row-gap:0;align-items:start;}
  .map-panel{grid-area:map;border-bottom:0;border-bottom-left-radius:0;border-bottom-right-radius:0;}
  .ctrl-panel{grid-area:ctrl;border-top:0;border-top-left-radius:0;border-top-right-radius:0;}
  .stage[data-fit="stacked"]{grid-template-columns:minmax(0,1fr);grid-template-areas:"map" "aside" "ctrl";}
  .stage[data-fit="stacked"] aside.detail{position:static;border-radius:0;border-bottom:0;border-top:1px solid var(--border-soft);}
  .stage[data-fit="stacked"] .tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;min-width:0;}
  .diagram{padding:8px 6px 0;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  /* When the map scrolls sideways, the clipped edge fades out (a hint that there is more). */
  .map-wrap{position:relative;}
  .map-wrap::before,.map-wrap::after{content:"";position:absolute;top:0;bottom:0;width:32px;pointer-events:none;opacity:0;transition:opacity .2s;z-index:1;}
  .map-wrap::before{left:0;border-top-left-radius:12px;background:linear-gradient(to right, var(--surface), transparent);}
  .map-wrap::after{right:0;border-top-right-radius:12px;background:linear-gradient(to left, var(--surface), transparent);}
  .map-wrap.fade-l::before,.map-wrap.fade-r::after{opacity:1;}
  /* Map scale stays between 0.85x (node titles >= 11px) and 1.15x (small maps are not blown up):
     --map-w is the viewBox width. Below 0.85x the panel scrolls sideways instead of shrinking. */
  .diagram svg{display:block;margin:0 auto;width:min(100%, calc(var(--map-w) * 1.15));min-width:calc(var(--map-w) * .85);height:auto;}
  /* beside the narration a map may go down to 0.80x (titles ~10.4px); the runtime picks "side" only
     when it fits there at that scale */
  @media (min-width:1181px){.stage[data-fit="side"] .diagram svg{min-width:calc(var(--map-w) * .8);}}

  /* ==== Map ================================================================
     Every rule starts with .wt-map: the export copies exactly these rules into the SVG file.
     Text sizes match TEXT_WT in scripts/lib/walkthrough-layout.mjs (used to warn about overflow). */
  .wt-map .grp rect{fill:none;stroke:var(--border);stroke-width:1.2;stroke-dasharray:4 4;}
  .wt-map .grp .gt{fill:var(--text);font:600 12.5px var(--font-sans);}
  .wt-map .grp .gm{fill:var(--muted);font:400 10.5px var(--font-mono);}
  .wt-map .node.client{--k-bg:var(--client-bg);--k-bd:var(--client-bd);--k-tx:var(--client-tx);}
  .wt-map .node.app{--k-bg:var(--app-bg);--k-bd:var(--app-bd);--k-tx:var(--app-tx);}
  .wt-map .node.store{--k-bg:var(--store-bg);--k-bd:var(--store-bd);--k-tx:var(--store-tx);}
  .wt-map .node.infra{--k-bg:var(--infra-bg);--k-bd:var(--infra-bd);--k-tx:var(--infra-tx);}
  .wt-map .node.dep{--k-bg:var(--dep-bg);--k-bd:var(--dep-bd);--k-tx:var(--dep-tx);}
  .wt-map .node.tool{--k-bg:var(--tool-bg);--k-bd:var(--tool-bd);--k-tx:var(--tool-tx);}
  .wt-map .node{cursor:pointer;transition:opacity .25s;}
  .wt-map .node rect.box{fill:var(--k-bg);stroke:var(--k-bd);stroke-width:1.4;transition:stroke .2s,stroke-width .2s;}
  .wt-map .node.store rect.box{stroke-width:2;}
  .wt-map .node .nt{font:600 13px var(--font-sans);fill:var(--text);}
  .wt-map .node .nm{font:400 10.5px var(--font-mono);fill:var(--k-tx);}
  .wt-map .node .ns{font:400 11px var(--font-sans);fill:var(--muted);}
  .wt-map .node .nl{font:400 10.5px var(--font-mono);fill:var(--k-tx);white-space:pre;}
  .wt-map .node .nl.m{fill:var(--muted);}
  .wt-map .node:hover rect.box{stroke-width:2.2;}
  .wt-map .node:focus{outline:none;}
  .wt-map .node:focus-visible rect.box{stroke:var(--primary);stroke-width:2.6;}
  .wt-map .node.sel rect.box{stroke:var(--text);stroke-width:2.2;}
  .wt-map .gauge-bg{fill:var(--surface);stroke:var(--k-bd);stroke-width:1;}
  .wt-map .gauge{fill:var(--k-tx);opacity:.35;transition:height .5s ease,y .5s ease;}
  .wt-map .gauge-l{font:700 11px var(--font-mono);fill:var(--k-tx);text-anchor:middle;dominant-baseline:central;}
  .wt-map .skipmark{display:none;}
  .wt-map .skipmark.show{display:inline;}
  .wt-map .skipmark rect{fill:var(--cc-bg);stroke:var(--cc);stroke-width:1.2;}
  .wt-map .skipmark text{font:700 11px var(--font-sans);fill:var(--cc-tx);text-anchor:middle;}

  .wt-map .edge path.ln{fill:none;stroke:var(--muted);stroke-width:1.6;marker-end:url(#wt-arw);transition:stroke .2s;}
  .wt-map .edge[data-k="file"] path.ln{stroke-width:2.6;stroke:var(--store-bd);}
  .wt-map .edge[data-k="text"] path.ln{stroke:var(--app-bd);stroke-width:1.8;}
  .wt-map .edge[data-k="ctrl"] path.ln{stroke-dasharray:2 4;stroke-linecap:round;}
  .wt-map .edge path.hit{fill:none;stroke:transparent;stroke-width:12;}
  .wt-map .edge{transition:opacity .25s;}

  .wt-map.focus .node,.wt-map.focus .edge,.wt-map.focus .grp-muted{opacity:var(--dim);}
  .wt-map.focus .node.on{opacity:.62;}
  .wt-map.focus .edge.on{opacity:.5;}
  .wt-map.focus .edge.on path.ln{stroke:var(--cc);}
  .wt-map.focus .node.cur,.wt-map.focus .node.skip{opacity:1;}
  .wt-map.focus .node.cur rect.box{stroke:var(--cc);stroke-width:2.6;}
  .wt-map.focus .edge.cur{opacity:1;}
  .wt-map.focus .edge.cur path.ln{stroke:var(--cc);stroke-width:3.2;stroke-dasharray:6 4;stroke-linecap:butt;marker-end:url(#wt-arw-on);animation:wt-flow .9s linear infinite;}
  .wt-map.focus .node.skip rect.box{stroke-dasharray:6 4;}
  .wt-map #wt-arw-on path{fill:var(--cc);}
  .wt-map #wt-arw path{fill:var(--muted);}
  @keyframes wt-flow{to{stroke-dashoffset:-20;}}

  .wt-map .badges{display:none;}
  .wt-map .badges.show{display:inline;}
  .wt-map .badge circle{fill:var(--surface);stroke:var(--cc);stroke-width:1.6;}
  .wt-map .badge text{font:700 10.5px var(--font-mono);fill:var(--cc-tx);text-anchor:middle;dominant-baseline:central;}
  .wt-map .badge{cursor:pointer;opacity:.75;}
  .wt-map .badge:focus{outline:none;}
  .wt-map .badge:focus-visible circle{stroke:var(--primary);stroke-width:2.6;}
  .wt-map .badge.cur{opacity:1;}
  .wt-map .badge.cur circle{fill:var(--cc);}
  .wt-map .badge.cur text{fill:var(--surface);}

  .wt-map .xm{pointer-events:none;}
  .wt-map .xm rect{fill:var(--err-bg);stroke:var(--err);stroke-width:1.5;}
  .wt-map .xm text{font:700 11px var(--font-mono);fill:var(--err-tx);text-anchor:middle;dominant-baseline:central;}

  .wt-map .tok{pointer-events:none;}
  .wt-map .tok rect{stroke-width:1.5;}
  .wt-map .tok text{font:700 11px var(--font-mono);text-anchor:middle;dominant-baseline:central;}
  .wt-map .tok.file rect{fill:var(--store-bg);stroke:var(--store-tx);}
  .wt-map .tok.file text{fill:var(--store-tx);}
  .wt-map .tok.text rect{fill:var(--app-bg);stroke:var(--app-tx);}
  .wt-map .tok.text text{fill:var(--app-tx);}
  .wt-map .tok.ctrl rect{fill:var(--tool-bg);stroke:var(--tool-tx);}
  .wt-map .tok.ctrl text{fill:var(--text);}
  .wt-map .tok.err rect{fill:var(--err-bg);stroke:var(--err);}
  .wt-map .tok.err text{fill:var(--err-tx);}
  .wt-map .tok .halo{fill:none;stroke:var(--cc);stroke-width:2;opacity:.35;}

  /* ==== Controls & steps ================================================== */
  .ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--border);}
  .btn{cursor:pointer;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:5px 12px;font-size:13px;font-weight:500;white-space:nowrap;}
  .btn:hover:not(:disabled){border-color:var(--cc);}
  .btn:disabled{opacity:.45;cursor:default;}
  .btn.pri{background:var(--cc);border-color:var(--cc);color:var(--surface);}
  .btn[aria-pressed="true"]{background:var(--cc-bg);border-color:var(--cc);color:var(--cc-tx);}
  .counter{margin-left:auto;font:600 12.5px var(--font-mono);color:var(--muted);}
  .exp{display:inline-flex;flex-wrap:wrap;gap:4px;align-items:center;}
  .exp .btn{padding:3px 8px;font-size:12px;}
  .exp-status{flex-basis:100%;font-size:12px;color:var(--muted);min-height:0;}
  .exp-status:empty{display:none;}
  .exp-status[data-state="error"]{color:var(--err-tx);}
  .prog{height:3px;background:var(--surface-2);margin:0 12px;border-radius:2px;overflow:hidden;}
  .prog i{display:block;height:100%;width:0;background:var(--cc);transition:width .3s;}
  ol.steps{list-style:none;margin:0;padding:10px 12px 12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 8px;counter-reset:s;}
  ol.steps li{counter-increment:s;position:relative;border-radius:8px;background:var(--surface-2);font-size:13px;cursor:pointer;border:1px solid transparent;}
  ol.steps li button{all:unset;display:block;width:100%;box-sizing:border-box;padding:5px 10px 5px 34px;cursor:pointer;border-radius:8px;}
  ol.steps li button:focus-visible{outline:2px solid var(--primary);outline-offset:1px;}
  ol.steps li::before{content:counter(s);position:absolute;left:8px;top:6px;width:19px;height:19px;border-radius:50%;border:1.5px solid var(--cc);color:var(--cc-tx);font:700 10.5px/16px var(--font-mono);text-align:center;box-sizing:border-box;}
  ol.steps li .tk{font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-left:4px;}
  ol.steps li.cur{background:var(--cc-bg);border-color:var(--cc);}
  ol.steps li.cur::before{background:var(--cc);color:var(--surface);}
  ol.steps li.done{opacity:.72;}

  aside.detail{grid-area:aside;position:sticky;top:12px;padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;}
  .dh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .chip{display:inline-block;font:700 11.5px var(--font-mono);border-radius:6px;padding:1px 8px;background:var(--cc-bg);color:var(--cc-tx);border:1px solid var(--cc);}
  .chip.role{background:var(--surface-2);border-color:var(--border);color:var(--muted);}
  aside h2{font-size:16px;margin:0;line-height:1.4;}
  aside .lead{margin:0;font-size:13px;color:var(--muted);}
  aside .dmono{color:var(--muted);}
  .tri{margin:0;display:flex;flex-direction:column;gap:8px;}
  .tri div{background:var(--surface-2);border-radius:8px;padding:7px 10px 8px;}
  .tri dt{font-size:11.5px;color:var(--muted);font-weight:600;display:flex;gap:6px;align-items:center;}
  .tri dt i{font-style:normal;display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--cc);}
  .tri dt i.w{background:var(--store-tx);}
  .tri dt i.f{background:var(--err);}
  .tri dd{margin:2px 0 0;font-size:13px;}
  .note{background:var(--surface-2);border-radius:8px;padding:7px 10px 8px;font-size:12.5px;}
  .note b{display:block;font-size:11.5px;color:var(--muted);}
  .note ul{margin:2px 0 0;padding-left:18px;}
  .facts-l{margin:0;padding-left:18px;font-size:13px;display:flex;flex-direction:column;gap:4px;}
  .back{align-self:flex-start;}
  .hint{font-size:12px;color:var(--muted);margin:0;}

  /* ==== Below ============================================================= */
  .below{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) minmax(0,1fr);gap:12px;align-items:start;}
  .extra{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;min-width:0;}
  .card h3{font-size:14px;margin:0 0 8px;}
  .card-body{margin:0;font-size:13px;}
  .three{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;counter-reset:t;}
  .three li{counter-increment:t;position:relative;padding-left:26px;font-size:13px;}
  .three li::before{content:counter(t);position:absolute;left:0;top:1px;width:18px;height:18px;border-radius:5px;background:var(--store-bg);color:var(--store-tx);border:1px solid var(--store-bd);font:700 11px/16px var(--font-mono);text-align:center;box-sizing:border-box;}
  .tbl-wrap{overflow-x:auto;}
  table{border-collapse:collapse;width:100%;font-size:12.5px;}
  th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--border-soft);vertical-align:top;}
  th{color:var(--muted);font-weight:600;font-size:12px;}
  td:first-child{font-weight:600;white-space:nowrap;}
  .legend{display:flex;flex-direction:column;gap:10px;font-size:12.5px;}
  .legend h3{margin:0;}
  .lg-row{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;}
  .lg-muted{color:var(--muted);}
  .sw{display:inline-flex;align-items:center;gap:5px;}
  .sw i{width:14px;height:12px;border-radius:3px;border:1.4px solid;display:inline-block;}
  .sw.client i{background:var(--client-bg);border-color:var(--client-bd);}
  .sw.app i{background:var(--app-bg);border-color:var(--app-bd);}
  .sw.store i{background:var(--store-bg);border-color:var(--store-bd);}
  .sw.infra i{background:var(--infra-bg);border-color:var(--infra-bd);}
  .sw.dep i{background:var(--dep-bg);border-color:var(--dep-bd);}
  .sw.tool i{background:var(--tool-bg);border-color:var(--tool-bd);}
  .sw svg{width:34px;height:10px;}
  .sw svg line{stroke-width:2;}
  .lg-file{stroke:var(--store-bd);stroke-width:3 !important;}
  .lg-text{stroke:var(--app-bd);}
  .lg-ctrl{stroke:var(--muted);stroke-dasharray:2 4;stroke-linecap:round;}
  .tk-s{display:inline-block;font:700 10.5px var(--font-mono);border-radius:5px;padding:0 6px;border:1.4px solid;}
  .tk-s.file{background:var(--store-bg);border-color:var(--store-tx);color:var(--store-tx);}
  .tk-s.text{background:var(--app-bg);border-color:var(--app-tx);color:var(--app-tx);}
  .tk-s.ctrl{background:var(--tool-bg);border-color:var(--tool-tx);color:var(--text);}
  .tk-s.err{background:var(--err-bg);border-color:var(--err);color:var(--err-tx);}
  .considerations ol{margin:0;padding-left:18px;font-size:13px;display:flex;flex-direction:column;gap:6px;}
  .considerations .why{display:block;color:var(--muted);}
  .tool-card{margin-top:8px;}
  .tool-name{font:600 12px var(--font-mono);}
  .tool-card pre{margin:4px 0 0;padding:8px 10px;background:var(--surface-2);border-radius:8px;font:12px/1.5 var(--font-mono);overflow-x:auto;}
  .tool-note{font-size:12px;color:var(--muted);margin-top:4px;}
  footer{font-size:12px;color:var(--muted);border-top:1px solid var(--border);padding-top:10px;}

  @media (max-width:1180px){
    .stage{grid-template-columns:1fr;grid-template-areas:"map" "ctrl" "aside";}
    aside.detail{position:static;margin-top:12px;}
    .below{grid-template-columns:1fr 1fr;}
    .below .table-card{grid-column:1 / -1;order:-1;}
  }
  @media (max-width:820px){
    .cases{grid-template-columns:repeat(3,minmax(0,1fr));}
    ol.steps{grid-template-columns:1fr;}
  }
  @media (max-width:640px){
    .cases{grid-template-columns:repeat(2,minmax(0,1fr));}
    .case .s{display:none;}
    .below{grid-template-columns:1fr;}
    .below .table-card{grid-column:auto;order:0;}
    .counter{margin-left:0;width:100%;}
    h1{font-size:18px;}
  }
  @media (prefers-reduced-motion:reduce){
    .wt-map.focus .edge.cur path.ln{animation:none;}
    .wt-map .node,.wt-map .edge,.wt-map .gauge,.wt-map .node rect.box{transition:none;}
    .prog i{transition:none;}
    .map-wrap::before,.map-wrap::after{transition:none;}
  }

  /* ==== Self-check (#iad-selfcheck): result stays in the DOM for tools, hidden from view ==== */
  #iad-selfcheck-result{
    position:absolute;left:0;top:0;width:1px;height:1px;margin:0;padding:0;border:0;
    overflow:hidden;clip-path:inset(50%);white-space:pre;
  }
</style>
</head>
<body>
<div class="wrap" id="app" data-s="s1">
<header class="top">
<div>
{{IAD_WT_HEADER}}
</div>
<button class="theme-toggle" id="pgTheme" type="button" aria-label="{{t:theme_to_dark}}" title="{{t:theme_to_dark}}">
  <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
</button>
</header>

<section aria-labelledby="pick-l">
<p class="lbl" id="pick-l">{{t:pick_scenario}}</p>
<div class="cases" id="cases" role="group" aria-labelledby="pick-l">
{{IAD_WT_CASES}}
</div>
</section>

<div class="stage" id="stage" data-fit="side">
<div class="panel map-panel">
<div class="map-wrap" id="mapWrap">
<div class="diagram" id="diagram">
{{IAD_WT_MAP}}
</div>
</div>
</div>
<aside class="panel detail" id="detail"></aside>
<div class="panel ctrl-panel">
<div class="ctrl" role="group" aria-label="{{t:progress_label}}">
  <button type="button" class="btn" id="prev">{{t:prev}}</button>
  <button type="button" class="btn pri" id="next">{{t:next_step}}</button>
  <button type="button" class="btn" id="play" aria-pressed="false">{{t:autoplay}}</button>
  <button type="button" class="btn" id="reset">{{t:reset}}</button>
  <span class="counter" id="counter" aria-live="polite"></span>
  <span class="exp" role="group" aria-label="{{t:export_title}}" title="{{t:export_title}}">
    <button type="button" class="btn" id="pgExportPng">{{t:export_png}}</button>
    <button type="button" class="btn" id="pgExportSvg">{{t:export_svg}}</button>
    <button type="button" class="btn" id="pgExportCopy">{{t:export_copy}}</button>
  </span>
  <span class="exp-status" id="pgExportStatus" role="status" aria-live="polite"></span>
</div>
<div class="prog" aria-hidden="true"><i id="prog"></i></div>
<ol class="steps" id="steps" aria-label="{{t:steps_label}}"></ol>
</div>
</div>

{{IAD_WT_BELOW}}

{{IAD_WT_FOOTER}}
</div>
<script type="application/json" id="iad-data">{{IAD_DATA}}</script>
<script type="application/json" id="iad-i18n">{{IAD_I18N}}</script>
<script>
// ---- Walkthrough runtime: scenarios, steps, token, narration, theme, export, self-check.
// Everything comes from #iad-data (the IR), #iad-i18n (UI strings) and the static map SVG; nothing to edit here.
(function () {
  "use strict";
  var DOC = JSON.parse(document.getElementById("iad-data").textContent);
  var UI = JSON.parse(document.getElementById("iad-i18n").textContent);
  var SVGNS = "http://www.w3.org/2000/svg";
  var reduce = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

  // ---- BEGIN pure helpers (no DOM access; test/runtime.test.mjs runs this block in node:vm) ----
  var EXPORT_MAX_PIXELS = 16000000;  // ~16MP canvas area cap (Safari's limit)
  var EXPORT_MAX_SIDE = 16384;       // per-side canvas cap shared by current browsers

  // UI string with {name} placeholders filled; unknown placeholders are kept as-is.
  function t(key, params) {
    return String(UI[key]).replace(/\{(\w+)\}/g, function (m, name) {
      return params && Object.prototype.hasOwnProperty.call(params, name) ? String(params[name]) : m;
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&apos;" }[c];
    });
  }

  // Same rules as scripts/lib/markup.mjs inline(): escape everything, then `code` and **bold**.
  function inline(s) {
    return String(s).split(/(`[^`\n]+`)/).map(function (part, i) {
      return i % 2 === 1
        ? '<code class="ic">' + escapeHtml(part.slice(1, -1)) + "</code>"
        : escapeHtml(part).replace(/\*\*([^*\n]+?)\*\*/g, "<b>$1</b>");
    }).join("");
  }

  // Nodes a step touches: its own `nodes`, then both ends of each edge.
  function nodesOfStep(st, edges) {
    var out = (st.nodes || []).slice();
    st.edges.forEach(function (id) { out.push(edges[id].from, edges[id].to); });
    return out;
  }

  // Highlight sets for a scenario at step j (-1 = the whole path): on = used anywhere in the
  // scenario, cur = the current step (or everything at -1). Values are id -> true maps.
  function focusSets(steps, j, edges) {
    var allE = {}, allN = {}, curE = {}, curN = {};
    steps.forEach(function (st) {
      st.edges.forEach(function (e) { allE[e] = true; });
      nodesOfStep(st, edges).forEach(function (n) { allN[n] = true; });
    });
    if (j < 0) { curE = allE; curN = allN; }
    else {
      steps[j].edges.forEach(function (e) { curE[e] = true; });
      nodesOfStep(steps[j], edges).forEach(function (n) { curN[n] = true; });
    }
    return { allE: allE, allN: allN, curE: curE, curN: curN };
  }

  // Gauge values carry forward: the last value set at or before step j, else empty (0). The empty
  // label is the scenario's gauge_empty override, else the gauge's own `empty`.
  function gaugeState(gauges, steps, j, emptyOverride) {
    var out = {};
    gauges.forEach(function (g) {
      var own = emptyOverride && Object.prototype.hasOwnProperty.call(emptyOverride, g.id) ? emptyOverride[g.id] : g.empty;
      out[g.id] = { value: 0, label: own || "" };
    });
    for (var k = 0; k <= j && k < steps.length; k++) {
      var set = steps[k].gauges || {};
      Object.keys(set).forEach(function (id) { if (out[id]) out[id] = { value: set[id].value, label: set[id].label }; });
    }
    return out;
  }

  // The token travels the step's edges one after another: distance d along the summed lengths ->
  // {index of the path, distance along it}.
  function tokenAt(lengths, d) {
    for (var i = 0; i < lengths.length; i++) {
      if (d <= lengths[i] || i === lengths.length - 1) return { i: i, at: Math.max(0, Math.min(d, lengths[i])) };
      d -= lengths[i];
    }
    return { i: 0, at: 0 };
  }

  // The stretch of the token's route where the chip (w x 20, plus a margin) does not cover the
  // source or target box, so it never sits on a node title. at(d) -> {x, y}; boxes {x, y, w, h}.
  // Returns [from, to] distances; a route too short for the chip gives its middle twice.
  function freeSpan(at, total, w, boxA, boxB) {
    var hw = w / 2 + 4, hh = 14;
    function hits(p, b) { return !!b && p.x + hw > b.x && p.x - hw < b.x + b.w && p.y + hh > b.y && p.y - hh < b.y + b.h; }
    var d0 = 0, d1 = total;
    while (d0 < total && hits(at(d0), boxA)) d0 += 4;
    while (d1 > d0 && hits(at(d1), boxB)) d1 -= 4;
    if (d1 - d0 < 8) return [total / 2, total / 2];
    return [d0, d1];
  }

  // Horizontal scroll that brings [x1, x2] (scroll coordinates) into a view of width `view` with a
  // margin `pad`: null when it is already visible, else the new scrollLeft (centered, clamped).
  function scrollTarget(left, view, x1, x2, max, pad) {
    if (x1 >= left + pad && x2 <= left + view - pad) return null;
    var target = x2 - x1 > view - 2 * pad ? x1 - pad : (x1 + x2) / 2 - view / 2;
    return Math.max(0, Math.min(max, Math.round(target)));
  }

  // Desktop stage mode: "side" when the map fits beside the narration at >= 0.80x, else "stacked"
  // (map full width, narration under it). stageW: the stage's width; asideW: narration column +
  // gap; chrome: panel border + map padding.
  function chooseFit(stageW, vbW, asideW, chrome) {
    return (stageW - asideW - chrome) / vbW >= 0.8 ? "side" : "stacked";
  }

  function easeInOut(f) { return f < 0.5 ? 2 * f * f : 1 - Math.pow(-2 * f + 2, 2) / 2; }

  function sanitizeFilePart(s) {
    return String(s)
      .replace(/[\u0000-\u001f\u007f<>:"\/\\|?*]+/g, "")
      .replace(/\s+/g, "-")
      .replace(/-{2,}/g, "-")
      .replace(/^[-.]+|[-.]+$/g, "")
      .slice(0, 80);
  }

  // Canvas scale: 2x for crisp docs images, shrunk to the canvas area / side caps.
  function exportScale(w, h) {
    return Math.min(2, Math.sqrt(EXPORT_MAX_PIXELS / (w * h)), EXPORT_MAX_SIDE / Math.max(w, h));
  }

  function sameSet(a, b) {
    var ka = Object.keys(a).sort(), kb = Object.keys(b).sort();
    return ka.join("\u0000") === kb.join("\u0000");
  }

  // One scenario x step as observed in the DOM -> failures. expected: focusSets() + gauge labels +
  // marker count + badge count; obs: {curE, curN (id maps), narration, badges, gauges {id: label},
  // markers, overflow}.
  function judgeStep(scenario, j, expected, obs, out) {
    function add(check, detail) { out.push({ scenario: scenario, step: j, check: check, detail: detail }); }
    if (!sameSet(obs.curE, expected.curE)) add("cur-edges", Object.keys(obs.curE).length + " current edge(s), expected " + Object.keys(expected.curE).length);
    if (!sameSet(obs.curN, expected.curN)) add("cur-nodes", "highlighted nodes differ from the step");
    if (!String(obs.narration || "").trim()) add("narration", "the side panel is empty");
    if (obs.badges !== expected.badges) add("badges", obs.badges + " badge(s), expected " + expected.badges);
    Object.keys(expected.gauges).forEach(function (id) {
      if (obs.gauges[id] !== expected.gauges[id]) add("gauge", id + " shows " + JSON.stringify(obs.gauges[id]) + ", expected " + JSON.stringify(expected.gauges[id]));
    });
    if (obs.markers !== expected.markers) add("markers", obs.markers + " marker(s), expected " + expected.markers);
    if (obs.overflow) add("overflow", "the page scrolls horizontally");
  }
  // ---- END pure helpers ----

  var EDGES = {}, NODES = {};
  DOC.edges.forEach(function (e) { EDGES[e.id] = e; });
  DOC.nodes.forEach(function (n) { NODES[n.id] = n; });
  var SC = DOC.scenarios;
  var GAUGES = DOC.gauges || [];

  var svg = document.getElementById("wtMap");
  var app = document.getElementById("app");
  var casesEl = document.getElementById("cases");
  var stepsEl = document.getElementById("steps");
  var detail = document.getElementById("detail");
  var btnPrev = document.getElementById("prev");
  var btnNext = document.getElementById("next");
  var btnPlay = document.getElementById("play");
  var btnReset = document.getElementById("reset");
  var counter = document.getElementById("counter");
  var prog = document.getElementById("prog");
  var gMarkers = svg.querySelector(".wt-markers");
  var diagramEl = document.getElementById("diagram");
  var mapWrap = document.getElementById("mapWrap");
  var gTok = svg.querySelector(".wt-tokens");

  var edgeEls = {}, pathEls = {}, nodeEls = {}, gaugeEls = {}, gaugeLabels = {};
  Array.prototype.forEach.call(svg.querySelectorAll(".edge"), function (g) {
    var id = g.getAttribute("data-id");
    edgeEls[id] = g;
    pathEls[id] = g.querySelector("path.ln");
  });
  Array.prototype.forEach.call(svg.querySelectorAll(".node"), function (g) { nodeEls[g.getAttribute("data-id")] = g; });
  Array.prototype.forEach.call(svg.querySelectorAll(".gauge"), function (r) { gaugeEls[r.getAttribute("data-gauge")] = r; });
  Array.prototype.forEach.call(svg.querySelectorAll(".gauge-l"), function (r) { gaugeLabels[r.getAttribute("data-gauge-label")] = r; });
  var caseEls = Array.prototype.slice.call(casesEl.querySelectorAll(".case"));
  var badgeGroups = Array.prototype.slice.call(svg.querySelectorAll(".badges"));

  function box(id) {
    var r = nodeEls[id].querySelector("rect.box");
    return { x: +r.getAttribute("x"), y: +r.getAttribute("y"), w: +r.getAttribute("width"), h: +r.getAttribute("height") };
  }
  function mk(tag, attrs, parent, text) {
    var e = document.createElementNS(SVGNS, tag);
    if (attrs) Object.keys(attrs).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    if (text != null) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  }

  // ---- state
  var cur = 0, step = -1, timer = null, raf = 0, selNode = null, badgeEls = [];

  function pickScenario(i) {
    stopPlay();
    cur = i; step = -1; selNode = null;
    app.setAttribute("data-s", "s" + (i + 1));
    caseEls.forEach(function (b, j) { b.setAttribute("aria-pressed", j === i ? "true" : "false"); });
    stepsEl.innerHTML = "";
    SC[i].steps.forEach(function (st, j) {
      var li = document.createElement("li");
      var b = document.createElement("button");
      b.type = "button";
      b.innerHTML = inline(st.title) + ' <span class="tk">' + escapeHtml(st.token.text) + "</span>";
      b.addEventListener("click", function () { stopPlay(); go(j); });
      li.appendChild(b);
      stepsEl.appendChild(li);
    });
    badgeGroups.forEach(function (g) { g.classList.toggle("show", g.getAttribute("data-s") === SC[i].id); });
    badgeEls = badgeGroups[i] ? Array.prototype.slice.call(badgeGroups[i].querySelectorAll(".badge")) : [];
    Array.prototype.forEach.call(svg.querySelectorAll(".skipmark"), function (m) { m.classList.toggle("show", m.getAttribute("data-s") === SC[i].id); });
    render();
  }

  function render() {
    var sc = SC[cur], steps = sc.steps, total = steps.length;
    var f = focusSets(steps, step, EDGES);
    var skip = {};
    (sc.skip || []).forEach(function (k) { skip[k.node] = true; });
    svg.classList.add("focus");
    Object.keys(edgeEls).forEach(function (id) {
      edgeEls[id].classList.toggle("on", !!f.allE[id]);
      edgeEls[id].classList.toggle("cur", !!f.curE[id]);
    });
    Object.keys(nodeEls).forEach(function (id) {
      nodeEls[id].classList.toggle("on", !!f.allN[id]);
      nodeEls[id].classList.toggle("cur", !!f.curN[id]);
      nodeEls[id].classList.toggle("skip", !!skip[id]);
      nodeEls[id].classList.toggle("sel", id === selNode);
    });
    badgeEls.forEach(function (b, j) { b.classList.toggle("cur", step < 0 || j === step); });
    // gauges
    var gs = gaugeState(GAUGES, steps, step, sc.gauge_empty);
    Object.keys(gaugeEls).forEach(function (id) {
      var r = gaugeEls[id], gy = +r.getAttribute("data-gy"), gh = +r.getAttribute("data-gh");
      var h = Math.max(0, Math.round((gh - 2) * gs[id].value));
      r.setAttribute("height", h);
      r.setAttribute("y", gy + gh - 1 - h);
      gaugeLabels[id].textContent = gs[id].label;
    });
    // error markers (top right of the node)
    gMarkers.innerHTML = "";
    if (step >= 0) {
      (steps[step].markers || []).forEach(function (m) {
        var b = box(m.node);
        var g = mk("g", { "class": "xm" }, gMarkers);
        var rect = mk("rect", { y: -10, height: 20, rx: 6 }, g);
        var text = mk("text", null, g, m.label);
        var w = 0;
        try { w = text.getComputedTextLength() + 14; } catch (e) { w = 0; }
        if (!w || w < 30) w = Math.max(30, m.label.length * 8 + 14);
        rect.setAttribute("x", -w / 2);
        rect.setAttribute("width", w);
        g.setAttribute("transform", "translate(" + (b.x + b.w - w / 2 - 6) + "," + (b.y - 2) + ")");
      });
    }
    // step list
    Array.prototype.forEach.call(stepsEl.querySelectorAll("li"), function (li, j) {
      li.classList.toggle("cur", j === step);
      li.classList.toggle("done", step >= 0 && j < step);
      var b = li.querySelector("button");
      if (j === step) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
    });
    btnPrev.disabled = step < 0;
    btnNext.disabled = step >= total - 1;
    counter.textContent = step < 0 ? t("counter_all", { total: total }) : t("counter_step", { step: step + 1, total: total });
    prog.style.width = (step < 0 ? 0 : ((step + 1) / total) * 100) + "%";
    if (selNode) renderNode(selNode); else renderStep();
    runToken();
    if (step >= 0) followStep(f.curE, f.curN);
    else scrollMapTo(0); // the full path (and a new scenario) starts at the start of the map
  }

  // ---- narrow screens: keep the current step in view and show which side has more map
  function updateFade() {
    var max = diagramEl.scrollWidth - diagramEl.clientWidth;
    mapWrap.classList.toggle("fade-l", max > 1 && diagramEl.scrollLeft > 2);
    mapWrap.classList.toggle("fade-r", max > 1 && diagramEl.scrollLeft < max - 2);
  }
  function followStep(curE, curN) {
    var max = diagramEl.scrollWidth - diagramEl.clientWidth;
    if (max <= 1) return;
    var vb = svg.viewBox.baseVal, r = svg.getBoundingClientRect(), dr = diagramEl.getBoundingClientRect();
    var k = r.width / vb.width, x1 = Infinity, x2 = -Infinity;
    function add(el) {
      try { var b = el.getBBox(); x1 = Math.min(x1, b.x); x2 = Math.max(x2, b.x + b.width); } catch (e) { /* not rendered */ }
    }
    Object.keys(curN).forEach(function (id) { add(nodeEls[id].querySelector("rect.box")); });
    Object.keys(curE).forEach(function (id) { add(pathEls[id]); });
    if (x1 > x2) return;
    var origin = r.left - dr.left + diagramEl.scrollLeft;
    var to = scrollTarget(diagramEl.scrollLeft, diagramEl.clientWidth, origin + (x1 - vb.x) * k, origin + (x2 - vb.x) * k, max, 24);
    if (to !== null) scrollMapTo(to);
  }
  function scrollMapTo(left, instant) {
    // always issue the scroll: it also replaces a smooth scroll still in flight
    if (diagramEl.scrollTo) diagramEl.scrollTo({ left: left, behavior: reduce || instant ? "auto" : "smooth" });
    else diagramEl.scrollLeft = left;
  }
  diagramEl.addEventListener("scroll", updateFade, { passive: true });

  // ---- stage mode: decided at load and on resize (debounced); CSS does the rest
  var stageEl = document.getElementById("stage");
  function decideFit() {
    var narrow = window.matchMedia && window.matchMedia("(max-width:1180px)").matches;
    var mode = narrow ? "narrow" : chooseFit(stageEl.clientWidth, svg.viewBox.baseVal.width, 340 + 12, 2 + 12);
    if (stageEl.getAttribute("data-fit") !== mode) stageEl.setAttribute("data-fit", mode);
    updateFade();
  }
  var fitTimer = null;
  window.addEventListener("resize", function () {
    clearTimeout(fitTimer);
    fitTimer = setTimeout(decideFit, 120);
  });

  function renderStep() {
    var sc = SC[cur];
    if (step < 0) {
      var note = "";
      if (sc.note) {
        note = '<div class="note">' + (sc.note.title ? "<b>" + inline(sc.note.title) + "</b>" : "") +
          "<ul>" + sc.note.items.map(function (it) { return "<li>" + inline(it) + "</li>"; }).join("") + "</ul></div>";
      }
      detail.innerHTML = '<div class="dh"><span class="chip">' + escapeHtml(t("chip_steps", { total: sc.steps.length })) + '</span><span class="chip role">' + escapeHtml(t("all_path")) + "</span></div>" +
        "<h2>" + inline(sc.title) + '</h2><p class="lead">' + inline(sc.lead) + "</p>" + note +
        '<p class="hint">' + inline(t("lead_hint")) + "</p>";
      return;
    }
    var st = sc.steps[step];
    detail.innerHTML = '<div class="dh"><span class="chip">' + escapeHtml(t("chip_step", { step: step + 1 })) + '</span><span class="tk-s ' + st.token.kind + '">' + escapeHtml(st.token.text) + "</span></div>" +
      "<h2>" + inline(st.title) + "</h2>" +
      '<dl class="tri"><div><dt><i></i>' + escapeHtml(t("what")) + "</dt><dd>" + inline(st.what) + "</dd></div>" +
      '<div><dt><i class="w"></i>' + escapeHtml(t("where")) + "</dt><dd>" + inline(st.where) + "</dd></div>" +
      '<div><dt><i class="f"></i>' + escapeHtml(t("fail")) + "</dt><dd>" + inline(st.fail) + "</dd></div></dl>";
  }

  function renderNode(id) {
    var n = NODES[id];
    detail.innerHTML = '<div class="dh"><span class="chip role">' + inline(DOC.legend.nodes[n.kind] || n.kind) + "</span>" +
      (n.mono ? '<span class="mono dmono">' + escapeHtml(n.mono) + "</span>" : "") + "</div>" +
      "<h2>" + escapeHtml(n.title) + "</h2>" +
      (n.facts ? '<ul class="facts-l">' + n.facts.map(function (f) { return "<li>" + inline(f) + "</li>"; }).join("") + "</ul>" : "") +
      '<button type="button" class="btn back" id="back">' + escapeHtml(step < 0 ? t("back_to_scenario") : t("back_to_step", { step: step + 1 })) + "</button>";
    document.getElementById("back").addEventListener("click", function () { selNode = null; render(); });
  }
  function showNode(id) { stopPlay(); selNode = selNode === id ? null : id; render(); }

  // ---- token: moves along the step's edges in order, loops with a short hold
  function runToken() {
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    gTok.innerHTML = "";
    if (step < 0) return;
    var st = SC[cur].steps[step];
    var tok = mk("g", { "class": "tok " + st.token.kind }, gTok);
    var halo = mk("rect", { "class": "halo" }, tok);
    var r = mk("rect", { rx: 5, height: 20, y: -10 }, tok);
    var text = mk("text", null, tok, st.token.text);
    var w = 0;
    try { w = text.getComputedTextLength() + 16; } catch (e) { w = 0; }
    if (!w || w < 30) w = st.token.text.length * 7.5 + 16;
    r.setAttribute("x", -w / 2); r.setAttribute("width", w);
    halo.setAttribute("x", -w / 2 - 4); halo.setAttribute("y", -14); halo.setAttribute("width", w + 8); halo.setAttribute("height", 28); halo.setAttribute("rx", 8);
    function place(p) { tok.setAttribute("transform", "translate(" + p.x.toFixed(1) + "," + p.y.toFixed(1) + ")"); }
    if (!st.edges.length) {
      var b = box(st.nodes[0]);
      place({ x: b.x + b.w / 2, y: b.y + b.h + 4 });
      return;
    }
    var ps = st.edges.map(function (id) { return pathEls[id]; });
    var ls = ps.map(function (p) { return p.getTotalLength(); });
    var tot = ls.reduce(function (s, x) { return s + x; }, 0);
    function at(d) { var k = tokenAt(ls, d); return ps[k.i].getPointAtLength(k.at); }
    var first = EDGES[st.edges[0]], last = EDGES[st.edges[st.edges.length - 1]];
    var span = freeSpan(at, tot, w, box(first.from), box(last.to));
    var from = span[0], len = span[1] - span[0];
    if (reduce) { place(at(from + len * 0.5)); return; }
    var dur = Math.max(1100, Math.min(2600, tot * 7)), hold = 500, t0 = null;
    function frame(ts) {
      if (t0 === null) t0 = ts;
      var e = (ts - t0) % (dur + hold), f = easeInOut(Math.min(1, e / dur));
      place(at(from + len * f));
      tok.style.opacity = e > dur + hold - 160 ? String(Math.max(0, (dur + hold - e) / 160)) : "1";
      raf = requestAnimationFrame(frame);
    }
    place(at(from));
    raf = requestAnimationFrame(frame);
  }

  // ---- progress
  function go(j) { var tot = SC[cur].steps.length; step = Math.max(-1, Math.min(tot - 1, j)); selNode = null; render(); }
  function stopPlay() {
    if (timer) { clearTimeout(timer); timer = null; }
    btnPlay.setAttribute("aria-pressed", "false");
    btnPlay.textContent = t("autoplay");
  }
  function tick() {
    var tot = SC[cur].steps.length;
    if (step >= tot - 1) { stopPlay(); return; }
    go(step + 1);
    timer = setTimeout(tick, 2900);
  }

  caseEls.forEach(function (b, i) { b.addEventListener("click", function () { pickScenario(i); }); });
  Object.keys(nodeEls).forEach(function (id) {
    var g = nodeEls[id];
    g.addEventListener("click", function () { showNode(id); });
    g.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); showNode(id); }
    });
  });
  badgeGroups.forEach(function (grp) {
    Array.prototype.forEach.call(grp.querySelectorAll(".badge"), function (b) {
      b.addEventListener("click", function () { stopPlay(); go(+b.getAttribute("data-step")); });
      b.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); stopPlay(); go(+b.getAttribute("data-step")); }
      });
    });
  });
  btnPrev.addEventListener("click", function () { stopPlay(); go(step - 1); });
  btnNext.addEventListener("click", function () { stopPlay(); go(step + 1); });
  btnReset.addEventListener("click", function () { stopPlay(); go(-1); });
  btnPlay.addEventListener("click", function () {
    if (timer) { stopPlay(); return; }
    btnPlay.setAttribute("aria-pressed", "true");
    btnPlay.textContent = t("pause");
    if (step >= SC[cur].steps.length - 1) step = -1;
    tick();
  });
  // ←/→ move between steps from anywhere except text fields, including while a map box has focus
  // (boxes and badges handle Enter/Space themselves).
  document.addEventListener("keydown", function (ev) {
    var tg = ev.target;
    if (tg && (tg.tagName === "INPUT" || tg.tagName === "TEXTAREA" || tg.isContentEditable)) return;
    if (ev.key === "ArrowRight") { stopPlay(); go(step + 1); }
    else if (ev.key === "ArrowLeft") { stopPlay(); go(step - 1); }
  });

  decideFit();
  pickScenario(0);

  // ---- Theme toggle: flips data-theme on <html> (set early in <head>) and remembers the choice.
  // Without a saved choice the page keeps following the OS preference.
  var themeBtn = document.getElementById("pgTheme");
  var rootEl = document.documentElement;
  function syncThemeButton() {
    var label = t(rootEl.getAttribute("data-theme") === "dark" ? "theme_to_light" : "theme_to_dark");
    themeBtn.setAttribute("aria-label", label);
    themeBtn.setAttribute("title", label);
  }
  function savedTheme() {
    try { return localStorage.getItem("iad-theme"); } catch (e) { return null; }
  }
  themeBtn.addEventListener("click", function () {
    var next = rootEl.getAttribute("data-theme") === "dark" ? "light" : "dark";
    rootEl.setAttribute("data-theme", next);
    try { localStorage.setItem("iad-theme", next); } catch (e) { /* not persisted on this page */ }
    syncThemeButton();
  });
  if (window.matchMedia) {
    var darkQuery = window.matchMedia("(prefers-color-scheme: dark)");
    var onSchemeChange = function (e) {
      if (savedTheme()) return;
      rootEl.setAttribute("data-theme", e.matches ? "dark" : "light");
      syncThemeButton();
    };
    if (darkQuery.addEventListener) darkQuery.addEventListener("change", onSchemeChange);
    else if (darkQuery.addListener) darkQuery.addListener(onSchemeChange);
  }
  syncThemeButton();

  // ---- Self-check: walks every scenario x step (-1 included) and compares the page with the IR.
  // The result is JSON in <pre id="iad-selfcheck-result" data-state="pass|fail"> and one console line.
  function observe() {
    var curE = {}, curN = {}, gauges = {};
    Object.keys(edgeEls).forEach(function (id) { if (edgeEls[id].classList.contains("cur")) curE[id] = true; });
    Object.keys(nodeEls).forEach(function (id) { if (nodeEls[id].classList.contains("cur")) curN[id] = true; });
    Object.keys(gaugeLabels).forEach(function (id) { gauges[id] = gaugeLabels[id].textContent; });
    var shown = badgeGroups.filter(function (g) { return g.classList.contains("show"); });
    return {
      curE: curE, curN: curN, gauges: gauges,
      narration: detail.textContent,
      badges: shown.reduce(function (s, g) { return s + g.querySelectorAll(".badge").length; }, 0),
      markers: gMarkers.querySelectorAll(".xm").length,
      overflow: document.documentElement.scrollWidth > document.documentElement.clientWidth + 1
    };
  }
  function selfCheck() {
    return new Promise(function (resolve) {
      if (document.readyState === "complete") resolve(); else window.addEventListener("load", function () { resolve(); });
    }).then(function () { return document.fonts && document.fonts.ready; }).then(function () {
      var savedCur = cur, savedStep = step;
      var failures = [], checked = 0;
      SC.forEach(function (sc, i) {
        pickScenario(i);
        for (var j = -1; j < sc.steps.length; j++) {
          go(j);
          var f = focusSets(sc.steps, j, EDGES);
          var gs = gaugeState(GAUGES, sc.steps, j, sc.gauge_empty), labels = {};
          Object.keys(gs).forEach(function (id) { labels[id] = gs[id].label; });
          var expected = { curE: f.curE, curN: f.curN, badges: sc.steps.length, gauges: labels, markers: j >= 0 ? (sc.steps[j].markers || []).length : 0 };
          judgeStep(sc.id, j, expected, observe(), failures);
          checked++;
        }
      });
      pickScenario(savedCur);
      go(savedStep);
      scrollMapTo(0, true); // leave the map at its start
      var errors = (window.__iadErrors || []).slice();
      var result = { ok: !failures.length && !errors.length, checked: checked, scenarios: SC.length, failures: failures, errors: errors };
      var json = JSON.stringify(result);
      var pre = document.getElementById("iad-selfcheck-result");
      if (!pre) {
        pre = document.createElement("pre");
        pre.id = "iad-selfcheck-result";
        document.body.appendChild(pre);
      }
      pre.textContent = json;
      pre.setAttribute("data-state", result.ok ? "pass" : "fail");
      console.log("IAD_SELFCHECK " + json);
      return result;
    });
  }
  window.iadSelfCheck = selfCheck;
  function selfCheckFromHash() { if (location.hash === "#iad-selfcheck") selfCheck(); }
  window.addEventListener("hashchange", selfCheckFromHash);
  selfCheckFromHash();

  // ---- Export: the map in its current view (theme, scenario, step) as PNG, SVG or a clipboard
  // image. The SVG is a copy of the live one with the .wt-map rules, the embedded fonts and the
  // current token values (including the scenario color) inlined, so it renders the same anywhere.
  var exportPngBtn = document.getElementById("pgExportPng");
  var exportSvgBtn = document.getElementById("pgExportSvg");
  var exportCopyBtn = document.getElementById("pgExportCopy");
  var exportStatusEl = document.getElementById("pgExportStatus");

  function setExportStatus(text, isError) {
    exportStatusEl.textContent = text;
    if (isError) exportStatusEl.setAttribute("data-state", "error");
    else exportStatusEl.removeAttribute("data-state");
  }
  function setExportBusy(busy) {
    [exportPngBtn, exportSvgBtn, exportCopyBtn].forEach(function (b) { b.disabled = busy; });
    if (busy) setExportStatus(t("export_busy"), false);
  }
  function errorReason(e) {
    if (!e) return "?";
    return e.name && e.name !== "Error" ? e.name : (e.message || String(e));
  }

  function buildExport() {
    var css = [];
    var tokens = {};
    // .wt-map rules, including those inside @media blocks that match now (e.g. reduced motion)
    function collect(rules) {
      Array.prototype.forEach.call(rules || [], function (rule) {
        var sel = rule.selectorText || "";
        if (rule.type === 5) css.push(rule.cssText); // @font-face
        else if (rule.type === 4) { if (window.matchMedia(rule.media.mediaText).matches) collect(rule.cssRules); } // @media
        else if (/^:root$|^\[data-theme/.test(sel)) {
          for (var i = 0; i < rule.style.length; i++) if (rule.style[i].indexOf("--") === 0) tokens[rule.style[i]] = true;
        } else if (sel.indexOf(".wt-map") === 0) css.push(rule.cssText);
      });
    }
    Array.prototype.forEach.call(document.styleSheets, function (sheet) {
      var rules;
      try { rules = sheet.cssRules; } catch (e) { return; } // unreadable sheet: skip
      collect(rules);
    });
    var live = getComputedStyle(app);
    var decl = "";
    Object.keys(tokens).concat(["--cc", "--cc-bg", "--cc-tx"]).forEach(function (name) {
      var v = live.getPropertyValue(name).trim();
      if (v) decl += name + ":" + v + ";";
    });
    var vb = svg.viewBox.baseVal;
    var clone = svg.cloneNode(true);
    clone.removeAttribute("id");
    clone.setAttribute("xmlns", SVGNS);
    clone.setAttribute("width", vb.width);
    clone.setAttribute("height", vb.height);
    clone.setAttribute("style", decl);
    var styleEl = document.createElementNS(SVGNS, "style");
    styleEl.textContent = css.join("\n") + "\n.wt-map *{transition:none !important;animation:none !important;}";
    var bg = document.createElementNS(SVGNS, "rect");
    bg.setAttribute("x", vb.x);
    bg.setAttribute("y", vb.y);
    bg.setAttribute("width", vb.width);
    bg.setAttribute("height", vb.height);
    bg.setAttribute("style", "fill:var(--surface)");
    clone.insertBefore(bg, clone.firstChild);
    clone.insertBefore(styleEl, clone.firstChild);
    var part = step < 0 ? SC[cur].id : SC[cur].id + "-" + (step + 1);
    var base = [sanitizeFilePart(DOC.meta.title), sanitizeFilePart(part)].filter(Boolean).join("-");
    return { svg: new XMLSerializer().serializeToString(clone), width: vb.width, height: vb.height, base: base };
  }

  function renderPng(ex) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      function paint() {
        try {
          var s = exportScale(ex.width, ex.height);
          var canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.floor(ex.width * s));
          canvas.height = Math.max(1, Math.floor(ex.height * s));
          var ctx = canvas.getContext("2d");
          if (!ctx) throw new Error("no 2d context");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          canvas.toBlob(function (blob) {
            if (blob) resolve(blob); else reject(new Error("toBlob returned null"));
          }, "image/png");
        } catch (e) {
          reject(e);
        }
      }
      img.onload = function () {
        // decode() lets embedded fonts finish before the first draw (first-export font race)
        if (img.decode) img.decode().then(paint, paint); else paint();
      };
      img.onerror = function () { reject(new Error("SVG image did not load")); };
      img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(ex.svg);
    });
  }

  function saveBlob(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
  }

  exportPngBtn.addEventListener("click", function () {
    setExportBusy(true);
    var name = "export.png";
    Promise.resolve().then(function () {
      var ex = buildExport();
      name = ex.base + ".png";
      return renderPng(ex);
    }).then(function (blob) {
      saveBlob(blob, name);
      setExportBusy(false);
      setExportStatus(t("export_saved", { file: name }), false);
    }, function (e) {
      setExportBusy(false);
      setExportStatus(t("export_png_failed", { reason: errorReason(e) }), true);
    });
  });

  exportSvgBtn.addEventListener("click", function () {
    setExportBusy(true);
    try {
      var ex = buildExport();
      saveBlob(new Blob([ex.svg], { type: "image/svg+xml" }), ex.base + ".svg");
      setExportBusy(false);
      setExportStatus(t("export_saved", { file: ex.base + ".svg" }), false);
    } catch (e) {
      setExportBusy(false);
      setExportStatus(t("export_svg_failed", { reason: errorReason(e) }), true);
    }
  });

  exportCopyBtn.addEventListener("click", function () {
    if (!navigator.clipboard || !navigator.clipboard.write || typeof ClipboardItem === "undefined") {
      setExportStatus(t("export_clip_unsupported"), true);
      return;
    }
    // The ClipboardItem must be created synchronously inside the click (user activation, Safari),
    // so it gets a promise for the PNG instead of the finished blob.
    var png;
    try { png = renderPng(buildExport()); } catch (e) { png = Promise.reject(e); }
    png.catch(function () {}); // handled below; avoids an unhandled-rejection report
    var write;
    try {
      write = navigator.clipboard.write([new ClipboardItem({ "image/png": png })]);
    } catch (e) {
      write = Promise.reject(e);
    }
    setExportBusy(true);
    write.then(function () {
      setExportBusy(false);
      setExportStatus(t("export_copied"), false);
    }, function (e) {
      png.then(function () {
        setExportBusy(false);
        setExportStatus(t("export_clip_denied", { reason: errorReason(e) }), true);
      }, function (pngError) {
        setExportBusy(false);
        setExportStatus(t("export_png_failed", { reason: errorReason(pngError) }), true);
      });
    });
  });
})();
</script>
</body>
</html>
