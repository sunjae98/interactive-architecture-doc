<script>
// Theme before first paint (no flash): the saved choice, else the OS preference. localStorage can
// throw on file:// (blocked storage), so every access is guarded.
(function () {
  var theme = null;
  try { theme = localStorage.getItem("iad-theme"); } catch (e) { /* storage unavailable */ }
  if (theme !== "light" && theme !== "dark") {
    theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  document.documentElement.setAttribute("data-theme", theme);
})();
</script>
<script>
// Page errors from load onward, read by the self-check (#iad-selfcheck). Capped so a noisy page stays small.
(function () {
  var errors = window.__iadErrors = [];
  function add(type, message) { if (errors.length < 50) errors.push({ type: type, message: String(message) }); }
  window.addEventListener("error", function (e) {
    add("error", (e.message || "error") + (e.filename ? " @ " + e.filename + ":" + e.lineno : ""));
  });
  window.addEventListener("unhandledrejection", function (e) {
    var r = e.reason;
    add("unhandledrejection", r && r.message ? r.message : r);
  });
  document.addEventListener("securitypolicyviolation", function (e) {
    add("csp", e.violatedDirective + " blocked " + (e.blockedURI || "inline"));
  });
})();
</script>

<style>
  /* ==== Design tokens ======================================================
     The ONLY place colors may appear. Component CSS and JS reference tokens.
     Colors: Radix Colors 3.0.0 (MIT) — neutral slate, kinds crimson / violet / green / amber,
     primary blue; the comment after each value names the scale and step.
     Spacing, radius, shadows: Primer Primitives 11.10.0 (MIT). */
  :root{
    color-scheme:light;
    --color-bg:#f9f9fb;             /* slate 2 */
    --color-surface:#fcfcfd;        /* slate 1 */
    --color-surface-2:#f0f0f3;      /* slate 3 */
    --color-border:#d9d9e0;         /* slate 6 */
    --color-text:#1c2024;           /* slate 12 */
    --color-text-muted:#60646c;     /* slate 11 */
    --color-on-solid:#ffffff;       /* text on step-9 fills */
    --color-primary:#0090ff;        /* blue 9 */
    --color-primary-bg:#e6f4fe;     /* blue 3 */
    --color-primary-text:#113264;   /* blue 12 (blue 11 is 4.25:1 on blue 3) */
    --color-hatch:#fcfcfd;          /* slate 1 (stripes on the slate 2 page) */
    --line:#b9bbc6;                 /* slate 8 */
    /* code blocks are dark in both themes */
    --color-code-bg:#111113;        /* slate dark 1 */
    --color-code-text:#3dd68c;      /* green dark 11 */

    --kind-client-bg:#ffe9f0;       /* crimson 3 */
    --kind-client-border:#eaacc3;   /* crimson 7 */
    --kind-client-solid:#e93d82;    /* crimson 9 */
    --kind-client-text:#cb1d63;     /* crimson 11 */

    --kind-decision-bg:#f4f0fe;     /* violet 3 */
    --kind-decision-border:#c2b5f5; /* violet 7 */
    --kind-decision-solid:#6e56cf;  /* violet 9 */
    --kind-decision-text:#6550b9;   /* violet 11 */
    --kind-decision-tag-bg:#ebe4ff; /* violet 4 */
    --kind-decision-code-text:#baa7ff; /* violet dark 11 */

    /* green 11 / amber 11 are below 4.5:1 on their step-3 background in light, so text uses step 12 */
    --kind-existing-bg:#e6f6eb;     /* green 3 */
    --kind-existing-border:#8eceaa; /* green 7 */
    --kind-existing-solid:#30a46c;  /* green 9 */
    --kind-existing-text:#193b2d;   /* green 12 */
    --kind-existing-zone-bg:#f4fbf6; /* green 2 */

    --kind-new-bg:#fff7c2;          /* amber 3 */
    --kind-new-border:#e9c162;      /* amber 7 */
    --kind-new-solid:#ffc53d;       /* amber 9 */
    --kind-new-text:#4f3422;        /* amber 12 */
    --kind-new-on-solid:#4f3422;    /* amber 12: amber 9 needs dark text */
    --kind-new-code-text:#ffca16;   /* amber dark 11 */

    /* "IAD Sans" / "Geist Mono" are inlined by the renderer (IAD_FONTS slot); system stacks follow,
       and the system emoji fonts come last for scenario icons. */
    --font-sans:"IAD Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji";
    --font-mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji";

    --radius-dot:3px;               /* borderRadius-small */
    --radius-tag:6px;               /* borderRadius-medium */
    --radius-badge:6px;             /* borderRadius-medium */
    --radius-control:6px;           /* borderRadius-medium */
    --radius-node:6px;              /* borderRadius-medium */
    --radius-card:12px;             /* borderRadius-large */
    --radius-zone:12px;             /* borderRadius-large */
    --radius-internal:12px;         /* borderRadius-large */
    --radius-pill:9999px;           /* borderRadius-full */

    --space-1:4px;                  /* base-size-4 */
    --space-2:6px;                  /* base-size-6 */
    --space-3:8px;                  /* base-size-8 */
    --space-4:12px;                 /* base-size-12 */
    --space-5:24px;                 /* base-size-24 */
    --space-6:32px;                 /* base-size-32 */

    --shadow-card:0 1px 1px 0 #25292e1a,0 3px 6px 0 #25292e1f;                        /* shadow-resting-medium */
    --shadow-panel:0 0 0 1px #d1d9e040,0 6px 12px -3px #25292e0a,0 6px 18px 0 #25292e1f; /* shadow-floating-small */
    --shadow-active:0 0 0 3px #5eb1ef,0 6px 12px -3px #25292e0a,0 6px 18px 0 #25292e1f; /* blue 8 ring + floating-small */
  }
  /* Dark theme: Radix dark steps (same step numbers as light), Primer dark shadows. Tokens not
     repeated here (primary, solids, code block colors, fonts, scales) are theme-independent. */
  [data-theme="dark"]{
    color-scheme:dark;
    --color-bg:#111113;             /* slate dark 1 */
    --color-surface:#18191b;        /* slate dark 2 */
    --color-surface-2:#212225;      /* slate dark 3 */
    --color-border:#363a3f;         /* slate dark 6 */
    --color-text:#edeef0;           /* slate dark 12 */
    --color-text-muted:#b0b4ba;     /* slate dark 11 */
    --color-primary-bg:#0d2847;     /* blue dark 3 */
    --color-primary-text:#70b8ff;   /* blue dark 11 */
    --color-hatch:#18191b;          /* slate dark 2 (stripes on the slate dark 1 page) */
    --line:#5a6169;                 /* slate dark 8 */

    --kind-client-bg:#381525;       /* crimson dark 3 */
    --kind-client-border:#873356;   /* crimson dark 7 */
    --kind-client-text:#ff92ad;     /* crimson dark 11 */

    --kind-decision-bg:#291f43;     /* violet dark 3 */
    --kind-decision-border:#56468b; /* violet dark 7 */
    --kind-decision-text:#baa7ff;   /* violet dark 11 */
    --kind-decision-tag-bg:#33255b; /* violet dark 4 */

    --kind-existing-bg:#132d21;     /* green dark 3 */
    --kind-existing-border:#28684a; /* green dark 7 */
    --kind-existing-text:#3dd68c;   /* green dark 11 */
    --kind-existing-zone-bg:#121b17; /* green dark 2 */

    --kind-new-bg:#302008;          /* amber dark 3 */
    --kind-new-border:#714f19;      /* amber dark 7 */
    --kind-new-text:#ffca16;        /* amber dark 11 */

    --shadow-card:0 1px 1px 0 #01040966,0 3px 6px 0 #010409cc;                         /* shadow-resting-medium (dark) */
    --shadow-panel:0 0 0 1px #3d444d,0 6px 12px -3px #01040966,0 6px 18px 0 #01040966;   /* shadow-floating-small (dark) */
    --shadow-active:0 0 0 3px #2870bd,0 6px 12px -3px #01040966,0 6px 18px 0 #01040966;  /* blue dark 8 ring + floating-small */
  }

  /* ==== Base ============================================================== */
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--color-bg);
    color:var(--color-text);
    font-family:var(--font-sans);
    padding:28px 16px 90px;
    word-break:keep-all;
    overflow-wrap:break-word;
  }
  h1{text-align:center;font-size:20px;font-weight:600;margin:0 0 var(--space-1);}
  .subtitle{text-align:center;color:var(--color-text-muted);font-size:13px;margin-bottom:var(--space-5);}
  .subtitle.small{margin-top:0;margin-bottom:26px;font-size:11.5px;}
  code.ic{
    font-family:var(--font-mono);font-size:.92em;
    background:var(--color-surface-2);border-radius:var(--radius-dot);padding:0 4px;
  }

  /* ==== Stepper & legend ================================================== */
  .stepper{
    max-width:1200px;margin:0 auto var(--space-4);
    display:flex;align-items:center;gap:var(--space-1);flex-wrap:nowrap;
    overflow-x:auto;padding-bottom:2px;
  }
  .step{
    display:flex;align-items:center;gap:var(--space-2);flex-shrink:0;white-space:nowrap;
    background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-pill);
    padding:6px 12px 6px 8px;font-size:10.8px;color:var(--color-text);
  }
  .step .num{
    width:20px;height:20px;border-radius:50%;background:var(--color-primary);color:var(--color-on-solid);
    font-weight:700;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .step-arrow{color:var(--color-text-muted);font-size:14px;flex-shrink:0;}

  .legend{
    display:flex;justify-content:center;gap:18px;flex-wrap:wrap;
    margin-bottom:30px;font-size:12px;color:var(--color-text-muted);
  }
  .legend span{display:inline-flex;align-items:center;gap:var(--space-2);}
  .dot{width:10px;height:10px;border-radius:var(--radius-dot);display:inline-block;}
  .dot.client{background:var(--kind-client-solid);}
  .dot.decision{background:var(--kind-decision-solid);}
  .dot.existing{background:var(--kind-existing-solid);}
  .dot.new{background:var(--kind-new-solid);}

  /* ==== Board ============================================================= */
  .board{max-width:920px;margin:0 auto;}
  .center-row{display:flex;justify-content:center;}
  .plain-arrow{text-align:center;color:var(--color-text-muted);font-size:20px;line-height:1;margin:var(--space-2) 0;}
  .fork-col .plain-arrow{margin:2px 0;}
  /* margin-bottom clears the step badge (.node .num sits 10px above the node, plus its 2px ring) */
  .arrow-label{display:block;font-size:10.3px;font-weight:600;color:var(--color-text-muted);line-height:1.4;margin-top:1px;margin-bottom:var(--space-4);}

  .node{
    border-radius:var(--radius-node);padding:11px var(--space-4);font-size:12.3px;line-height:1.5;
    border:1.5px solid var(--color-border);background:var(--color-surface);position:relative;text-align:center;
    z-index:1;min-width:0;max-width:100%;
  }
  .node.w-narrow{width:70%;}
  .node.w-wide{width:92%;}
  .node.w-full{width:100%;}
  .node .num{
    position:absolute;top:-10px;left:calc(50% - 11px);
    width:22px;height:22px;border-radius:50%;color:var(--color-on-solid);font-size:12px;font-weight:700;
    display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--color-bg);
  }
  .node .tag{
    display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.03em;
    padding:1px 7px;border-radius:var(--radius-tag);margin-bottom:var(--space-2);
  }
  .node.client{border-color:var(--kind-client-border);background:var(--kind-client-bg);}
  .node.client .num{background:var(--kind-client-solid);}
  .node.decision{border-color:var(--kind-decision-border);background:var(--kind-decision-bg);}
  .node.decision .num{background:var(--kind-decision-solid);}
  .node.decision .tag{background:var(--kind-decision-tag-bg);color:var(--kind-decision-text);}
  .node.existing{border-color:var(--kind-existing-border);}
  .node.existing .num{background:var(--kind-existing-solid);}
  .node.existing .tag{background:var(--kind-existing-bg);color:var(--kind-existing-text);}
  .node.new{border-color:var(--kind-new-border);}
  .node.new .num{background:var(--kind-new-solid);color:var(--kind-new-on-solid);}
  .node.new .tag{background:var(--kind-new-bg);color:var(--kind-new-text);}

  .node .blk{
    display:block;background:var(--color-code-bg);border-radius:var(--radius-tag);padding:6px 8px;margin-top:var(--space-2);
    font-size:10.6px;color:var(--color-code-text);white-space:pre-wrap;text-align:left;
    font-family:var(--font-mono);
    overflow-wrap:break-word;word-break:break-word;
  }
  .node.new .blk{color:var(--kind-new-code-text);}
  .node.decision .blk{color:var(--kind-decision-code-text);}
  .note{font-size:10.4px;color:var(--color-text-muted);margin-top:var(--space-2);}

  .internal{
    border:1.5px dashed var(--color-border);
    border-radius:var(--radius-internal);
    padding:26px 18px 16px;
    margin:8px 0;
    position:relative;
    background:repeating-linear-gradient(135deg, var(--color-hatch) 0 10px, transparent 10px 20px);
  }
  .internal .badge{
    position:absolute;top:-11px;left:16px;
    background:var(--color-surface-2);border:1px solid var(--color-border);border-radius:var(--radius-badge);
    padding:2px 8px;font-size:10.5px;font-weight:700;color:var(--color-text-muted);letter-spacing:.02em;
  }

  .detail-grid{
    display:grid;grid-template-columns:1fr 1.3fr;gap:16px;margin-top:8px;text-align:left;
    align-items:start;
  }
  .detail-grid.no-left{grid-template-columns:1fr;}
  .detail-left{min-width:0;}
  .detail-left .blk{margin-top:0;}
  .detail-right{display:flex;flex-direction:column;gap:9px;min-width:0;}
  .detail-item{border-left:2.5px solid var(--kind-new-solid);padding-left:9px;}
  .detail-item.alt-item{border-left-color:var(--kind-existing-solid);}
  .detail-title{font-size:11px;font-weight:700;color:var(--kind-new-text);}
  .detail-item.alt-item .detail-title{color:var(--kind-existing-text);}
  .detail-body{font-size:10.6px;color:var(--color-text-muted);line-height:1.55;margin-top:2px;}
  @media (max-width:640px){ .detail-grid{grid-template-columns:1fr;} }

  .external-zone{
    border:1.5px dashed var(--kind-existing-border);
    border-radius:var(--radius-zone);
    padding:24px var(--space-4) 16px;
    margin:16px 0;
    position:relative;
    background:var(--kind-existing-zone-bg);
  }
  .external-zone .badge2{
    position:absolute;top:-11px;left:16px;
    background:var(--kind-existing-bg);border:1px solid var(--kind-existing-border);border-radius:var(--radius-badge);
    padding:2px 8px;font-size:10.5px;font-weight:700;color:var(--kind-existing-text);letter-spacing:.02em;
  }

  .fork-zone{position:relative;}
  .zone-overlay{
    position:absolute;top:0;left:0;width:100%;height:100%;
    pointer-events:none;z-index:0;display:block;
    color:var(--line);
  }

  /* Column counts come from the renderer as style="--cols:N;--cols-md:M" (M = min(N,2)). */
  .fork-row{
    display:grid;grid-template-columns:repeat(var(--cols,4),1fr);gap:var(--space-3);align-items:start;
    margin-top:12px;position:relative;z-index:1;
  }
  .fork-zone .fork-row{margin-top:40px;}
  .fork-col{display:flex;flex-direction:column;gap:var(--space-2);min-width:0;}
  /* margin-bottom + the column gap clear the step badge of the node below */
  .fork-title{text-align:center;font-size:10.8px;color:var(--color-text-muted);margin-bottom:var(--space-3);position:relative;z-index:1;}

  .external-row{display:grid;grid-template-columns:repeat(var(--cols,4),1fr);gap:12px;margin-top:12px;align-items:start;}
  .external-card{
    background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-node);
    padding:var(--space-3) 12px;font-size:11px;
  }
  .external-card .name{font-weight:600;text-align:center;margin-bottom:var(--space-2);}
  .external-list{list-style:disc;margin:0;padding-left:15px;font-size:10.2px;color:var(--color-text);line-height:1.55;}
  .external-list li{margin-bottom:3px;}
  .external-list .ext-tag{display:block;color:var(--color-text-muted);font-size:9.2px;}

  @media (max-width:1180px){
    .fork-row,.external-row{grid-template-columns:repeat(var(--cols-md,2),1fr);}
  }

  /* ==== Sections below the board ========================================= */
  .callout{max-width:900px;margin:var(--space-6) auto 0;display:grid;grid-template-columns:repeat(var(--cols,2),1fr);gap:var(--space-4);}
  .callout .card{
    background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-card);
    padding:var(--space-4) 16px;font-size:12.3px;line-height:1.6;
  }
  .callout .card h3{margin:0 0 var(--space-2);font-size:13px;}

  .considerations{max-width:900px;margin:var(--space-6) auto 0;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-card);padding:18px var(--space-5);}
  .considerations h3{margin:0 0 12px;font-size:14px;}
  .considerations ol{margin:0;padding-left:20px;}
  .considerations li{font-size:12.2px;line-height:1.7;margin-bottom:11px;color:var(--color-text);}
  .considerations li > b{color:var(--kind-new-text);}
  .considerations li .why{display:block;color:var(--color-text-muted);margin-top:2px;}

  .tldr{
    max-width:900px;margin:0 auto 28px;background:var(--color-surface);
    border:1.5px solid var(--kind-new-border);border-radius:var(--radius-zone);padding:18px var(--space-5);
    box-shadow:var(--shadow-card);
  }
  .tldr h2{margin:0 0 var(--space-1);font-size:14px;}
  .tldr .headline{font-size:12.8px;color:var(--color-text);margin-bottom:var(--space-4);line-height:1.6;}
  .tldr .headline > b{color:var(--kind-new-text);}
  .tldr ol{margin:0;padding-left:19px;}
  .tldr li{font-size:11.8px;line-height:1.6;margin-bottom:9px;color:var(--color-text);}
  .tldr li > b{color:var(--kind-new-text);}
  .tldr li .sub{display:block;color:var(--color-text-muted);margin-top:1px;}

  .tool-examples{max-width:900px;margin:var(--space-6) auto 0;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-card);padding:18px var(--space-5);}
  .tool-examples h3{margin:0 0 var(--space-1);font-size:14px;}
  .tool-examples .lead{font-size:11.5px;color:var(--color-text-muted);margin-bottom:16px;}
  .tool-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--space-4);}
  .tool-card{border:1px solid var(--color-border);border-radius:var(--radius-node);padding:12px var(--space-4);background:var(--color-bg);}
  .tool-card .tool-name{
    display:inline-block;font-size:11.5px;font-weight:700;color:var(--kind-new-text);
    font-family:var(--font-mono);
    background:var(--kind-new-bg);border-radius:var(--radius-tag);padding:2px 7px;margin-bottom:8px;
  }
  .tool-card pre{
    background:var(--color-code-bg);color:var(--kind-new-code-text);border-radius:var(--radius-control);padding:11px 12px;margin:0;
    font-size:10.3px;line-height:1.6;white-space:pre-wrap;overflow-wrap:break-word;
    font-family:var(--font-mono);
  }
  .tool-card .tool-note{font-size:10.3px;color:var(--color-text-muted);line-height:1.5;margin-top:8px;}
  @media (max-width:760px){ .tool-cards{grid-template-columns:1fr;} }

  @media (max-width:900px){
    .fork-row,.external-row{grid-template-columns:1fr;}
    .callout{grid-template-columns:1fr;}
  }

  /* ==== Layout: playground sidebar + main ================================= */
  .layout{
    display:flex;gap:var(--space-5);align-items:flex-start;
    max-width:1320px;margin:0 auto;
  }
  .sidebar{
    width:300px;flex-shrink:0;
    position:sticky;top:10px;
    max-height:calc(100vh - 20px);
    overflow-y:auto;
  }
  .main{flex:1;min-width:0;}
  @media (max-width:1080px){
    .layout{flex-direction:column;align-items:stretch;} /* stretch: fit-content would let the nowrap stepper widen the page */
    .sidebar{position:static;width:100%;max-height:none;}
  }

  /* ==== Playground ======================================================== */
  .playground{
    background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-zone);
    padding:var(--space-4);box-shadow:var(--shadow-panel);
  }
  .pg-row{display:flex;flex-direction:column;gap:8px;align-items:stretch;}
  .pg-row select{
    flex:1;min-width:160px;padding:9px var(--space-3);border-radius:var(--radius-control);border:1px solid var(--color-border);
    font-size:12.5px;color:var(--color-text);background:var(--color-bg);font-weight:600;
  }
  .pg-btn{
    border:1px solid var(--color-border);background:var(--color-surface);color:var(--color-text);
    border-radius:var(--radius-control);padding:8px 12px;font-size:12px;cursor:pointer;font-weight:600;
  }
  .pg-btn:hover{background:var(--color-surface-2);}
  .pg-btn.primary{background:var(--color-primary);border-color:var(--color-primary);color:var(--color-on-solid);}
  .pg-btn:disabled{opacity:.4;cursor:not-allowed;}
  .pg-btn[aria-pressed="true"]{background:var(--color-primary-bg);border-color:var(--color-primary);color:var(--color-primary-text);}
  .pg-btns{display:flex;gap:var(--space-2);}
  .pg-btns .pg-btn{flex:1;padding:8px var(--space-2);}
  .pg-status{font-size:10.6px;color:var(--color-text-muted);line-height:1.5;}
  .pg-panel{margin-top:var(--space-3);border-top:1px dashed var(--color-border);padding-top:var(--space-3);}
  .pg-panel-title{font-size:11px;font-weight:700;color:var(--color-text-muted);margin-bottom:5px;}
  .pg-panel-title + .pg-panel-title{margin-top:8px;}
  .pg-panel pre{
    margin:0;background:var(--color-code-bg);color:var(--color-code-text);border-radius:var(--radius-control);padding:var(--space-3) 12px;
    font-size:11.3px;line-height:1.55;white-space:pre-wrap;
    font-family:var(--font-mono);
    max-height:400px;overflow:auto;
  }
  .pg-branch{
    display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:var(--radius-tag);margin-left:var(--space-2);
    background:var(--color-primary-bg);color:var(--color-primary-text);
  }

  /* Theme toggle: an icon button fixed to the top-right corner. Shows the theme you switch to. */
  .theme-toggle{
    position:fixed;top:var(--space-4);right:var(--space-4);z-index:20;
    width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;padding:0;
    border:1px solid var(--color-border);border-radius:var(--radius-pill);
    background:var(--color-surface);color:var(--color-text);box-shadow:var(--shadow-panel);cursor:pointer;
  }
  .theme-toggle:hover{background:var(--color-surface-2);}
  .theme-toggle:focus-visible{outline:2px solid var(--color-primary);outline-offset:2px;}
  .theme-toggle svg{width:18px;height:18px;display:block;}
  .theme-toggle .icon-sun{display:none;}
  [data-theme="dark"] .theme-toggle .icon-sun{display:block;}
  [data-theme="dark"] .theme-toggle .icon-moon{display:none;}
  /* stacked layout: the sidebar sits at the top, so the toggle moves into its own strip above it */
  @media (max-width:1080px){
    body{padding-top:60px;}
    .theme-toggle{position:absolute;top:var(--space-3);}
  }
  [data-step]{cursor:pointer;}
  .node{transition:transform .18s ease,box-shadow .18s ease,opacity .18s ease,filter .18s ease;}
  .node.active{
    transform:scale(1.035);
    box-shadow:var(--shadow-active);
    z-index:5;
  }
  .node.altpath{opacity:.35;filter:grayscale(60%);}
  /* set while the export measures the live layout: running transitions jump to their end state */
  .iad-measuring .node{transition:none !important;}

  /* ==== Export (current view -> PNG / SVG / clipboard) ==================== */
  .pg-export-status{font-size:10.6px;color:var(--color-text-muted);line-height:1.5;margin-top:var(--space-2);min-height:1.5em;}
  .pg-export-status[data-state="error"]{color:var(--kind-client-text);}
  .export-caption{display:none;}
  /* Export-only overrides: the runtime clones every [data-export] element into .iad-export. */
  .iad-export{
    background:var(--color-bg);color:var(--color-text);font-family:var(--font-sans);
    word-break:keep-all;overflow-wrap:break-word;
  }
  .iad-export *,.iad-export *::before,.iad-export *::after{transition:none !important;animation:none !important;}
  .iad-export .stepper{flex-wrap:wrap;justify-content:center;overflow:visible;position:static;}
  .iad-export .legend{position:static;}
  .iad-export [data-step]{cursor:default;}
  .iad-export .export-caption{
    display:block;text-align:center;margin-top:var(--space-5);
    font-size:12px;font-weight:600;color:var(--color-text-muted);
  }

  /* ==== Self-check (#iad-selfcheck): result stays in the DOM for tools, hidden from view ==== */
  #iad-selfcheck-result{
    position:absolute;left:0;top:0;width:1px;height:1px;margin:0;padding:0;border:0;
    overflow:hidden;clip-path:inset(50%);white-space:pre;
  }
</style>
</head>

<script>
// ---- Fan arrows: driven only by data-fan-hub / data-fan-target inside each .fork-zone.
// Strokes use currentColor, so the color comes from the --line token on .zone-overlay.
(function () {
  function centerX(el, refLeft) {
    var r = el.getBoundingClientRect();
    return r.left + r.width / 2 - refLeft;
  }
  function topY(el, refTop) { return el.getBoundingClientRect().top - refTop; }
  function bottomY(el, refTop) { return el.getBoundingClientRect().bottom - refTop; }
  function line(x1, y1, x2, y2) {
    return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="currentColor" stroke-width="2"/>';
  }
  function arrowHead(x, yTip) {
    return '<polygon points="' + (x - 5) + ',' + (yTip - 7) + ' ' + (x + 5) + ',' + (yTip - 7) + ' ' + x + ',' + yTip + '" fill="currentColor"/>';
  }
  function own(zone, selector) {
    // only elements whose nearest fork zone is this one (nested forks draw their own arrows)
    return Array.prototype.filter.call(zone.querySelectorAll(selector), function (el) {
      return el.closest(".fork-zone") === zone;
    });
  }

  // ---- BEGIN pure helpers (no DOM access; test/runtime.test.mjs runs this block in node:vm) ----
  // Fan targets that get an arrow. A target must be the first node in its column (an arrow to a
  // lower node would cross the nodes above it), and its column must start in the first grid row:
  // when columns wrap (2 columns) or stack (1 column) only the top row is connected, which leaves one
  // short vertical connector from the hub in the stacked layout.
  function firstRowTargets(targets, colTop, isFirstInColumn) {
    var first = targets.filter(function (el) { return isFirstInColumn(el); });
    if (!first.length) return [];
    var firstRow = Math.min.apply(null, first.map(colTop));
    return first.filter(function (el) { return colTop(el) < firstRow + 1; });
  }
  // ---- END pure helpers ----

  function drawZone(zone) {
    var svg = own(zone, "[data-fan-svg]")[0];
    if (!svg) return;
    var zr = zone.getBoundingClientRect();
    svg.setAttribute("viewBox", "0 0 " + zone.clientWidth + " " + zone.clientHeight);
    svg.setAttribute("preserveAspectRatio", "none");

    var html = "";
    own(zone, "[data-fan-hub]").forEach(function (hub) {
      var hubId = hub.getAttribute("data-fan-hub");
      var targets = own(zone, "[data-fan-target]").filter(function (el) {
        return el.getAttribute("data-fan-target") === hubId;
      });
      if (!targets.length) return;
      targets = firstRowTargets(
        targets,
        function (el) { return (el.closest(".fork-col") || el).getBoundingClientRect().top; },
        function (el) {
          var col = el.closest(".fork-col");
          return !col || col.querySelector(".node") === el;
        }
      );
      if (!targets.length) return;
      var fromX = centerX(hub, zr.left), fromY = bottomY(hub, zr.top);
      // Arrows stop a few px above whatever sits on top of the target: the column title (".fork-title"
      // before the target), else the node's step badge, else the node itself.
      var points = targets.map(function (el) {
        var col = el.closest(".fork-col");
        var title = col && col.querySelector(".fork-title");
        var end = title && (title.compareDocumentPosition(el) & Node.DOCUMENT_POSITION_FOLLOWING) ? title : (el.querySelector(".num") || el);
        return { x: centerX(el, zr.left), y: topY(end, zr.top) - 3 };
      });
      var barY = fromY + 16;
      var xs = points.map(function (p) { return p.x; }).concat([fromX]);
      html += line(fromX, fromY, fromX, barY);
      html += line(Math.min.apply(null, xs), barY, Math.max.apply(null, xs), barY);
      points.forEach(function (p) { html += line(p.x, barY, p.x, p.y - 7) + arrowHead(p.x, p.y); });
    });
    svg.innerHTML = html;
  }

  function draw() { document.querySelectorAll(".fork-zone").forEach(drawZone); }
  window.draw = draw;

  var t;
  function drawSoon() { clearTimeout(t); t = setTimeout(draw, 100); }
  window.addEventListener("resize", drawSoon);
  window.addEventListener("load", draw);
  document.addEventListener("DOMContentLoaded", function () {
    draw();
    // zone size changes that are not window resizes (fonts, wrapping, details opening)
    if (window.ResizeObserver) {
      var ro = new ResizeObserver(drawSoon);
      document.querySelectorAll(".fork-zone").forEach(function (zone) { ro.observe(zone); });
    }
  });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
})();
</script>

<script>
// ---- Playground: replays the selected scenario step by step.
// Everything comes from #iad-data (the IR) and #iad-i18n (UI strings); nothing to edit here.
(function () {
  var DOC = JSON.parse(document.getElementById("iad-data").textContent);
  var UI = JSON.parse(document.getElementById("iad-i18n").textContent);
  var SCENARIOS = DOC.scenarios;
  var TOTAL_STEPS = DOC.steps.length;
  var ENTRY_REQUEST = DOC.meta.entry_request;
  var AUTOPLAY_INTERVAL_MS = 1800;

  var currentStep = 0;
  var autoPlayTimer = null;
  var selfChecking = false;
  var promptEl = document.getElementById("pgPrompt");
  var prevBtn = document.getElementById("pgPrev");
  var nextBtn = document.getElementById("pgNext");
  var resetBtn = document.getElementById("pgReset");
  var autoPlayBtn = document.getElementById("pgAutoPlay");
  var statusEl = document.getElementById("pgStatus");
  var branchLabelEl = document.getElementById("pgBranchLabel");
  var dataEl = document.getElementById("pgData");
  var entryEl = document.querySelector("[data-entry]");
  var entryDefault = entryEl ? entryEl.textContent : "";

  // ---- BEGIN pure helpers (no DOM access; test/runtime.test.mjs runs this block in node:vm) ----
  var EXPORT_MAX_PIXELS = 16000000;  // ~16MP canvas area cap (Safari's limit)
  var EXPORT_MAX_SIDE = 16384;       // per-side canvas cap shared by current browsers

  // UI string with {name} placeholders filled; unknown placeholders are kept as-is.
  function t(key, params) {
    return String(UI[key]).replace(/\{(\w+)\}/g, function (m, name) {
      return params && Object.prototype.hasOwnProperty.call(params, name) ? String(params[name]) : m;
    });
  }

  // meta.entry_request with {{input}} replaced in one pass: "{{input}}" in quotes becomes a
  // JSON-escaped string, a bare {{input}} the raw input. Replaced text is never re-scanned.
  function fillEntryRequest(template, input) {
    return template.replace(/"\{\{input\}\}"|\{\{input\}\}/g, function (m) {
      return m === "{{input}}" ? input : JSON.stringify(input);
    });
  }

  // Text for the entry node's code block: the request for this scenario's input. A scenario without
  // input keeps the authored code, or shows the request with an empty input if there is none.
  function entryText(template, input, fallback) {
    if (!template) return fallback;
    if (typeof input === "string") return fillEntryRequest(template, input);
    return fallback || fillEntryRequest(template, "");
  }

  function sanitizeFilePart(s) {
    return String(s)
      .replace(/[\u0000-\u001f\u007f<>:"\/\\|?*]+/g, "")
      .replace(/\s+/g, "-")
      .replace(/-{2,}/g, "-")
      .replace(/^[-.]+|[-.]+$/g, "")
      .slice(0, 80);
  }

  // Canvas scale: device pixel ratio clamped to 1..2, then shrunk to the canvas area / side caps.
  function exportScale(w, h, dpr) {
    var s = Math.min(Math.max(dpr || 1, 1), 2);
    return Math.min(s, Math.sqrt(EXPORT_MAX_PIXELS / (w * h)), EXPORT_MAX_SIDE / Math.max(w, h));
  }

  // Flattens stylesheet rules: @media / @supports are kept only when they match right now, so the
  // export looks like the live page even though the SVG has its own viewport. Token names declared
  // in :root / [data-theme] rules are collected so their current values can be inlined.
  function collectRules(rules, css, tokens) {
    Array.prototype.forEach.call(rules, function (rule) {
      if (window.CSSMediaRule && rule instanceof CSSMediaRule) {
        if (window.matchMedia(rule.media.mediaText).matches) collectRules(rule.cssRules, css, tokens);
        return;
      }
      if (window.CSSSupportsRule && rule instanceof CSSSupportsRule) {
        if (window.CSS && CSS.supports(rule.conditionText)) collectRules(rule.cssRules, css, tokens);
        return;
      }
      if (rule.style && /:root|\[data-theme/.test(rule.selectorText || "")) {
        for (var i = 0; i < rule.style.length; i++) {
          if (rule.style[i].indexOf("--") === 0) tokens[rule.style[i]] = true;
        }
      }
      css.push(rule.cssText);
    });
  }

  // Self-check: judges one scenario x step from what the page shows. obs = {
  //   active: number of .active nodes, data: data panel text, stepText: the scenario's text for the step,
  //   entry: entry request text or null without an entry node,
  //   fans: [{zone, targets: visible fan targets, drawn: drawn lines}], scrollWidth, clientWidth }
  // Failures and warnings are appended to out.failures / out.warnings.
  function judgeStep(scenario, step, obs, out) {
    function add(list, check, detail) { list.push({ scenario: scenario, step: step, check: check, detail: detail }); }
    if (!(obs.active >= 1)) add(out.failures, "active-node", "no active node");
    if (!obs.stepText) add(out.warnings, "step-text", "scenario has no steps text for this step (W_SCENARIO_STEP_MISSING)");
    if (!String(obs.data || "").trim()) add(out.failures, "data-panel", "data panel is empty");
    if (obs.entry !== null && obs.entry !== undefined && !String(obs.entry).trim()) add(out.failures, "entry-request", "entry request box is empty");
    (obs.fans || []).forEach(function (f) {
      if (f.targets > 0 && f.drawn < 1) add(out.failures, "fan-arrows", "fork zone " + f.zone + ": " + f.targets + " visible target(s), no arrow drawn");
    });
    if (obs.scrollWidth > obs.clientWidth + 1) add(out.failures, "overflow", "page scrollWidth " + obs.scrollWidth + " > clientWidth " + obs.clientWidth);
  }

  function selfCheckResult(scenarios, steps, out, errors) {
    return {
      ok: out.failures.length === 0 && errors.length === 0,
      checked: scenarios * steps,
      scenarios: scenarios,
      steps: steps,
      failures: out.failures,
      warnings: out.warnings,
      errors: errors
    };
  }
  // ---- END pure helpers ----

  SCENARIOS.forEach(function (sc) {
    var opt = document.createElement("option");
    opt.value = sc.id;
    opt.textContent = (sc.icon ? sc.icon + " " : "") + sc.label + (sc.input ? ' — "' + sc.input + '"' : "");
    promptEl.appendChild(opt);
  });

  function currentScenario() { return SCENARIOS[promptEl.selectedIndex] || SCENARIOS[0]; }

  function selectScenario(id) {
    // clicking a branch-only node switches the drop-down to that node's scenario
    for (var i = 0; i < SCENARIOS.length; i++) {
      if (SCENARIOS[i].id === id) { promptEl.selectedIndex = i; return; }
    }
  }

  function inScenario(el, id) {
    var b = el.getAttribute("data-branch");
    return !b || b.split(",").indexOf(id) !== -1;
  }

  function render() {
    var sc = currentScenario();
    branchLabelEl.textContent = sc.label;
    if (entryEl) entryEl.textContent = entryText(ENTRY_REQUEST, sc.input, entryDefault);

    var nodes = document.querySelectorAll(".node[data-step]");
    nodes.forEach(function (el) { el.classList.remove("active", "altpath"); });

    prevBtn.disabled = currentStep <= 0;
    nextBtn.disabled = currentStep >= TOTAL_STEPS;
    nextBtn.textContent = currentStep >= TOTAL_STEPS ? t("end") : t("next");

    if (currentStep === 0) {
      statusEl.textContent = t("status_idle", { total: TOTAL_STEPS });
      dataEl.textContent = t("data_idle");
      window.draw();
      return;
    }

    statusEl.textContent = t("status_step", { step: currentStep, total: TOTAL_STEPS, scenario: sc.label });

    nodes.forEach(function (el) {
      if (!inScenario(el, sc.id)) { el.classList.add("altpath"); return; }
      if (parseInt(el.getAttribute("data-step"), 10) === currentStep) el.classList.add("active");
    });

    var text = sc.steps[String(currentStep)];
    dataEl.textContent = text ? text : t("data_empty");

    var activeEl = document.querySelector(".node[data-step].active");
    if (activeEl && !selfChecking) activeEl.scrollIntoView({ behavior: "smooth", block: "center" });
    window.draw();
    setTimeout(window.draw, 260); // re-align arrows after the transform/scroll transition
  }

  function stopAutoPlay() {
    if (!autoPlayTimer) return;
    clearInterval(autoPlayTimer);
    autoPlayTimer = null;
    autoPlayBtn.textContent = t("autoplay");
    autoPlayBtn.classList.remove("primary");
  }

  function startAutoPlay() {
    if (currentStep >= TOTAL_STEPS) currentStep = 0;
    autoPlayBtn.textContent = t("pause");
    autoPlayBtn.classList.add("primary");
    currentStep++;
    render();
    autoPlayTimer = setInterval(function () {
      if (currentStep >= TOTAL_STEPS) { stopAutoPlay(); return; }
      currentStep++;
      render();
      if (currentStep >= TOTAL_STEPS) stopAutoPlay();
    }, AUTOPLAY_INTERVAL_MS);
  }

  nextBtn.addEventListener("click", function () {
    stopAutoPlay();
    if (currentStep < TOTAL_STEPS) { currentStep++; render(); }
  });
  prevBtn.addEventListener("click", function () {
    stopAutoPlay();
    if (currentStep > 0) { currentStep--; render(); }
  });
  resetBtn.addEventListener("click", function () {
    stopAutoPlay();
    currentStep = 0;
    render();
  });
  autoPlayBtn.addEventListener("click", function () {
    if (autoPlayTimer) stopAutoPlay(); else startAutoPlay();
  });
  promptEl.addEventListener("change", function () {
    stopAutoPlay();
    render();
  });

  document.addEventListener("click", function (e) {
    var el = e.target.closest(".node[data-step]");
    if (!el) return;
    stopAutoPlay();
    var b = el.getAttribute("data-branch");
    if (b && !inScenario(el, currentScenario().id)) selectScenario(b.split(",")[0]);
    currentStep = parseInt(el.getAttribute("data-step"), 10);
    render();
  });

  render();

  // ---- Self-check: replays every scenario x step with the functions above and reports what it saw.
  // Runs when the page is opened with #iad-selfcheck (or the hash is set later), or via window.iadSelfCheck().
  // The result is JSON in <pre id="iad-selfcheck-result" data-state="pass|fail"> and one console line.
  function observeStep() {
    var fans = [];
    document.querySelectorAll(".fork-zone").forEach(function (zone, i) {
      var own = function (sel) {
        return Array.prototype.filter.call(zone.querySelectorAll(sel), function (el) { return el.closest(".fork-zone") === zone; });
      };
      var svg = own("[data-fan-svg]")[0];
      fans.push({
        zone: i + 1,
        targets: own("[data-fan-target]").filter(function (el) { return el.getClientRects().length > 0; }).length,
        drawn: svg ? svg.querySelectorAll("line,path").length : 0
      });
    });
    var root = document.documentElement;
    return {
      active: document.querySelectorAll(".node[data-step].active").length,
      data: dataEl.textContent,
      stepText: currentScenario().steps[String(currentStep)],
      entry: entryEl ? entryEl.textContent : null,
      fans: fans,
      scrollWidth: root.scrollWidth,
      clientWidth: root.clientWidth
    };
  }

  function whenSettled() {
    return new Promise(function (resolve) {
      if (document.readyState === "complete") resolve(); else window.addEventListener("load", function () { resolve(); });
    }).then(function () { return document.fonts && document.fonts.ready; });
  }

  function selfCheck() {
    return whenSettled().then(function () {
      var saved = { index: promptEl.selectedIndex, step: currentStep, playing: !!autoPlayTimer, x: window.scrollX, y: window.scrollY };
      var out = { failures: [], warnings: [] };
      stopAutoPlay();
      selfChecking = true;
      var html = document.documentElement;
      html.classList.add("iad-measuring");
      try {
        SCENARIOS.forEach(function (sc, i) {
          promptEl.selectedIndex = i;
          for (var s = 1; s <= TOTAL_STEPS; s++) {
            currentStep = s;
            render();
            window.draw();
            judgeStep(sc.id, s, observeStep(), out);
          }
        });
      } finally {
        html.classList.remove("iad-measuring");
        selfChecking = false;
        promptEl.selectedIndex = saved.index;
        if (saved.playing) { currentStep = saved.step - 1; startAutoPlay(); }
        else { currentStep = saved.step; render(); }
        window.scrollTo(saved.x, saved.y);
      }
      var result = selfCheckResult(SCENARIOS.length, TOTAL_STEPS, out, (window.__iadErrors || []).slice());
      var json = JSON.stringify(result);
      var pre = document.getElementById("iad-selfcheck-result");
      if (!pre) {
        pre = document.createElement("pre");
        pre.id = "iad-selfcheck-result";
        document.body.appendChild(pre);
      }
      pre.textContent = json;
      pre.setAttribute("data-state", result.ok ? "pass" : "fail");
      console.log("IAD_SELFCHECK " + json);
      return result;
    });
  }
  window.iadSelfCheck = selfCheck;
  function selfCheckFromHash() { if (location.hash === "#iad-selfcheck") selfCheck(); }
  window.addEventListener("hashchange", selfCheckFromHash);
  selfCheckFromHash();

  // ---- Theme toggle: flips data-theme on <html> (set early in <head>) and remembers the choice.
  // Without a saved choice the page keeps following the OS preference.
  var themeBtn = document.getElementById("pgTheme");
  var rootEl = document.documentElement;
  function syncThemeButton() {
    var label = t(rootEl.getAttribute("data-theme") === "dark" ? "theme_to_light" : "theme_to_dark");
    themeBtn.setAttribute("aria-label", label);
    themeBtn.setAttribute("title", label);
  }
  function savedTheme() {
    try { return localStorage.getItem("iad-theme"); } catch (e) { return null; }
  }
  themeBtn.addEventListener("click", function () {
    var next = rootEl.getAttribute("data-theme") === "dark" ? "light" : "dark";
    rootEl.setAttribute("data-theme", next);
    try { localStorage.setItem("iad-theme", next); } catch (e) { /* not persisted on this page */ }
    syncThemeButton();
  });
  if (window.matchMedia) {
    var darkQuery = window.matchMedia("(prefers-color-scheme: dark)");
    var onSchemeChange = function (e) {
      if (savedTheme()) return;
      rootEl.setAttribute("data-theme", e.matches ? "dark" : "light");
      syncThemeButton();
    };
    if (darkQuery.addEventListener) darkQuery.addEventListener("change", onSchemeChange);
    else if (darkQuery.addListener) darkQuery.addListener(onSchemeChange);
  }
  syncThemeButton();

  // ---- Export: the current view (scenario + step) as PNG, SVG or a clipboard image.
  // Every [data-export] element is cloned into one .iad-export root at the live width, the page CSS
  // is inlined (with @media resolved against the live viewport) and the result is wrapped in
  // <svg><foreignObject>. PNG rasterizes that SVG through a data: URL so the canvas stays untainted.
  var EXPORT_PAD = 24;               // px around the captured content
  var exportPngBtn = document.getElementById("pgExportPng");
  var exportSvgBtn = document.getElementById("pgExportSvg");
  var exportCopyBtn = document.getElementById("pgExportCopy");
  var exportStatusEl = document.getElementById("pgExportStatus");
  var captionEl = document.querySelector(".export-caption");

  function setExportStatus(text, isError) {
    exportStatusEl.textContent = text;
    if (isError) exportStatusEl.setAttribute("data-state", "error");
    else exportStatusEl.removeAttribute("data-state");
  }

  function setExportBusy(busy) {
    [exportPngBtn, exportSvgBtn, exportCopyBtn].forEach(function (b) { b.disabled = busy; });
    if (busy) setExportStatus(t("export_busy"), false);
  }

  function errorReason(e) {
    if (!e) return "?";
    return e.name && e.name !== "Error" ? e.name : (e.message || String(e));
  }

  function exportFileBase(sc) {
    var parts = [sanitizeFilePart(DOC.meta.title), sanitizeFilePart(sc.id), "step" + currentStep];
    return parts.filter(Boolean).join("-");
  }

  // Synchronous: returns { svg, width, height, base }.
  function buildExport() {
    // Measure the settled layout: an active node may be mid-way through its 180ms scale transition.
    var html = document.documentElement;
    html.classList.add("iad-measuring");
    try {
      window.draw(); // fan arrows must match the live layout before cloning
    } finally {
      html.classList.remove("iad-measuring");
    }
    var sc = currentScenario();
    captionEl.textContent = t("export_caption", {
      scenario: (sc.icon ? sc.icon + " " : "") + sc.label,
      step: currentStep,
      total: TOTAL_STEPS
    });

    var css = [];
    var tokens = {};
    Array.prototype.forEach.call(document.styleSheets, function (sheet) {
      var rules;
      try { rules = sheet.cssRules; } catch (e) { return; } // unreadable sheet: skip
      if (rules) collectRules(rules, css, tokens);
    });

    var live = getComputedStyle(html);
    var width = Math.ceil(document.querySelector(".main").getBoundingClientRect().width) + 2 * EXPORT_PAD;
    var decl = "width:" + width + "px;padding:" + EXPORT_PAD + "px;";
    Object.keys(tokens).forEach(function (name) {
      var v = live.getPropertyValue(name).trim();
      if (v) decl += name + ":" + v + ";";
    });

    var root = document.createElement("div");
    root.className = "iad-export";
    root.setAttribute("lang", html.getAttribute("lang") || "en");
    if (html.getAttribute("data-theme")) root.setAttribute("data-theme", html.getAttribute("data-theme"));
    root.setAttribute("style", decl);
    var styleEl = document.createElement("style");
    styleEl.textContent = css.join("\n");
    root.appendChild(styleEl);
    document.querySelectorAll("[data-export]").forEach(function (el) { root.appendChild(el.cloneNode(true)); });

    // measure the height off-screen at the fixed width
    var host = document.createElement("div");
    host.setAttribute("aria-hidden", "true");
    host.style.cssText = "position:fixed;left:-100000px;top:0;visibility:hidden;pointer-events:none;";
    host.appendChild(root);
    document.body.appendChild(host);
    var height = Math.ceil(root.getBoundingClientRect().height);
    document.body.removeChild(host);
    host.removeChild(root);

    var svg =
      '<svg xmlns="http://www.w3.org/2000/svg" width="' + width + '" height="' + height +
      '" viewBox="0 0 ' + width + " " + height + '"><foreignObject x="0" y="0" width="' + width +
      '" height="' + height + '">' + new XMLSerializer().serializeToString(root) + "</foreignObject></svg>";
    return { svg: svg, width: width, height: height, base: exportFileBase(sc) };
  }

  function renderPng(ex) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      function paint() {
        try {
          var s = exportScale(ex.width, ex.height, window.devicePixelRatio);
          var canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.floor(ex.width * s));
          canvas.height = Math.max(1, Math.floor(ex.height * s));
          var ctx = canvas.getContext("2d");
          if (!ctx) throw new Error("no 2d context");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          canvas.toBlob(function (blob) {
            if (blob) resolve(blob); else reject(new Error("toBlob returned null"));
          }, "image/png");
        } catch (e) {
          reject(e); // SecurityError when the browser taints foreignObject canvases
        }
      }
      img.onload = function () {
        // decode() lets embedded fonts finish before the first draw (first-export font race)
        if (img.decode) img.decode().then(paint, paint); else paint();
      };
      img.onerror = function () { reject(new Error("SVG image did not load")); };
      img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(ex.svg);
    });
  }

  function saveBlob(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
  }

  // Runs fn after the next paint so the "Exporting…" status is visible before the synchronous build.
  function afterPaint(fn) {
    if (window.requestAnimationFrame) requestAnimationFrame(function () { setTimeout(fn, 0); });
    else setTimeout(fn, 0);
  }

  exportPngBtn.addEventListener("click", function () {
    setExportBusy(true);
    var name = "export.png";
    new Promise(function (resolve) { afterPaint(resolve); }).then(function () {
      var ex = buildExport();
      name = ex.base + ".png";
      return renderPng(ex);
    }).then(function (blob) {
      saveBlob(blob, name);
      setExportBusy(false);
      setExportStatus(t("export_saved", { file: name }), false);
    }, function (e) {
      setExportBusy(false);
      setExportStatus(t("export_png_failed", { reason: errorReason(e) }), true);
    });
  });

  exportSvgBtn.addEventListener("click", function () {
    setExportBusy(true);
    afterPaint(function () {
      try {
        var ex = buildExport();
        saveBlob(new Blob([ex.svg], { type: "image/svg+xml" }), ex.base + ".svg");
        setExportBusy(false);
        setExportStatus(t("export_saved", { file: ex.base + ".svg" }), false);
      } catch (e) {
        setExportBusy(false);
        setExportStatus(t("export_svg_failed", { reason: errorReason(e) }), true);
      }
    });
  });

  exportCopyBtn.addEventListener("click", function () {
    if (!navigator.clipboard || !navigator.clipboard.write || typeof ClipboardItem === "undefined") {
      setExportStatus(t("export_clip_unsupported"), true);
      return;
    }
    // The ClipboardItem must be created synchronously inside the click (user activation, Safari),
    // so it gets a promise for the PNG instead of the finished blob.
    var png;
    try { png = renderPng(buildExport()); } catch (e) { png = Promise.reject(e); }
    png.catch(function () {}); // handled below; avoids an unhandled-rejection report
    var write;
    try {
      write = navigator.clipboard.write([new ClipboardItem({ "image/png": png })]);
    } catch (e) {
      write = Promise.reject(e);
    }
    setExportBusy(true);
    write.then(function () {
      setExportBusy(false);
      setExportStatus(t("export_copied"), false);
    }, function (e) {
      png.then(function () {
        setExportBusy(false);
        setExportStatus(t("export_clip_denied", { reason: errorReason(e) }), true);
      }, function (pngError) {
        setExportBusy(false);
        setExportStatus(t("export_png_failed", { reason: errorReason(pngError) }), true);
      });
    });
  });
})();
</script>

</body>
</html>
